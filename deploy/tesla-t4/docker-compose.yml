# ask-ai 生产部署 compose(tesla-t4 全栈 GPU)
#
# 用法:
#   cd deploy/tesla-t4
#   cp .env.example .env  # 填生产凭证
#   docker compose pull
#   docker compose up -d
#
# 架构(决策 1a:全栈 tesla-t4):
#   - postgres:   16-alpine,持久卷
#   - weaviate:   1.28.0,持久卷
#   - backend:    GPU 镜像(uvicorn),挂载 corpus+models
#   - sync:       同镜像(command 覆盖为 sync.py),挂载 corpus+models
#
# GPU:nvidia runtime(--gpus all);共享约束见 .env EMBEDDER_BATCH_SIZE
# 挂载(决策 2/3,不打进镜像):
#   - corpus:  /home/ubuntu/ask-ai-corpus → /corpus:ro
#   - models:  /home/ubuntu/ask-ai/models  → /models:ro
#   - data:    postgres + weaviate 持久卷
#
# 更新:docker compose pull && docker compose up -d(见 update.sh)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ask_ai}
      POSTGRES_USER: ${POSTGRES_USER:-ask_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ask_ai}"]
      interval: 5s
      retries: 10

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.0
    restart: unless-stopped
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --scheme
      - http
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      DISABLE_TELEMETRY: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      GRPC_PORT: "50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 5s
      retries: 12

  backend:
    # 镜像由 GitHub Actions 构建(ghcr.io/harryhua-ai/ask-ai:<tag>)
    # 更新:docker compose pull(见 update.sh)
    image: ghcr.io/harryhua-ai/ask-ai:latest
    restart: unless-stopped
    ports:
      - "18000:8000"
    env_file:
      - ../../.env
    environment:
      # 生产配置(覆盖 .env 里的开发值)
      APP_MODE: prod
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-ask_ai}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-ask_ai}
      WEAVIATE_URL: http://weaviate:8080
      EMBEDDER_DEVICE: cuda
      EMBEDDER_BATCH_SIZE: "16"
      MODEL_CACHE_DIR: /models
      HF_HOME: /models
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      # 决策 2:corpus 挂载(sync worker 也用)
      - /home/ubuntu/ask-ai-corpus:/home/ubuntu/ask-ai-corpus:ro
      - /home/ubuntu/knowledge-support:/home/ubuntu/knowledge-support:ro
      # 决策 3:models 挂载(BGE-m3 + reranker,不打进镜像)
      - /home/ubuntu/ask-ai/models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  sync:
    # 同镜像,command 覆盖为 sync worker
    image: ghcr.io/harryhua-ai/ask-ai:latest
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-ask_ai}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-ask_ai}
      WEAVIATE_URL: http://weaviate:8080
      EMBEDDER_DEVICE: cuda
      EMBEDDER_BATCH_SIZE: "16"
      MODEL_CACHE_DIR: /models
      HF_HOME: /models
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - /home/ubuntu/ask-ai-corpus:/home/ubuntu/ask-ai-corpus:ro
      - /home/ubuntu/knowledge-support:/home/ubuntu/knowledge-support:ro
      - /home/ubuntu/ask-ai/models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    # sync worker:首次全量,之后增量(--reindex 仅 schema 变更时手动)
    # 增量由 cron 触发(见 sync-cron 服务),此服务跑一次全量初始化
    command: ["python", "scripts/sync.py"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  sync-cron:
    # 定时增量同步(每小时)
    image: ghcr.io/harryhua-ai/ask-ai:latest
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-ask_ai}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-ask_ai}
      WEAVIATE_URL: http://weaviate:8080
      EMBEDDER_DEVICE: cuda
      EMBEDDER_BATCH_SIZE: "16"
      MODEL_CACHE_DIR: /models
      HF_HOME: /models
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - /home/ubuntu/ask-ai-corpus:/home/ubuntu/ask-ai-corpus:ro
      - /home/ubuntu/knowledge-support:/home/ubuntu/knowledge-support:ro
      - /home/ubuntu/ask-ai/models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    # 每小时增量同步(cron 内嵌;docker 的 restart 策略保证失败重跑)
    # 简单实现:while true; sleep 1h; sync。生产可换 ofelia 或 host crontab。
    command: >
      sh -c "while true; do
        python3 scripts/sync.py || true;
        sleep 3600;
      done"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
  weaviate_data: