# 站点体验配置(MSW:CAMTHINK_V1_MULTI_SITE_WIDGET_INTEGRATION)
#
# 本文件为站点身份/体验的权威源;lifespan 启动与 scripts/migrate_add_site_experiences.py
# 将其幂等 upsert 进 site_experiences 表,运行时读取 DB。
# ops 流程:改本文件 → 重启后端(或跑迁移脚本)→ 生效。
#
# 规则(冻结契约):
# - site_id 是标识符不是凭证;授权 = 站点 enabled + 请求 Origin 精确命中 allowed_origins。
# - origin 必须显式枚举(含 scheme;端口非 80/443 时必须带上),禁止通配符。
# - starters 语义三站分离:website=发现/咨询,wiki=文档/实施/排障,store=购买决策。
#   文案可在语义不变前提下继续打磨。
# - 多语言闭环(ML Closure,G-L5):welcome/starters = 站点默认语言(= language 字段)
#   文案;welcome_i18n/starters_i18n = 按语言键的变体(当前 zh);请求语言无变体时
#   回落默认。站点身份(site_id/display_name/授权)与语言完全无关。

sites:
  - site_id: camthink-website
    display_name: CamThink 官网
    allowed_origins:
      - https://www.camthink.ai
      - https://camthink.ai
      # 外部 Widget 对接测试页(裸 IP + http)。canonical 形式 = scheme://host:
      # 浏览器 Origin 不含尾部「/」,http 默认端口 80 按规则剥除不写。
      - http://42.194.138.11
    welcome: "Hi! I'm the CamThink assistant. Ask me anything about our AIoT products."
    language: en
    starters:
      - "Which product fits my project?"
      - "Compare NE503 and NE301"
      - "Recommend a solution for smart agriculture"
      - "What interfaces does NE503 support?"
    welcome_i18n:
      zh: "你好!我是 CamThink 助手,关于我们的 AIoT 产品都可以问我。"
    starters_i18n:
      zh:
        - "哪个产品适合我的项目?"
        - "对比一下 NE503 和 NE301"
        - "推荐一个智慧农业方案"
        - "NE503 支持哪些接口?"

  - site_id: camthink-wiki
    display_name: CamThink Wiki
    allowed_origins:
      - https://wiki.camthink.ai
      # 外部 Widget 对接测试页(与 camthink-website 同一 Origin,三站镜像授权)。
      - http://42.194.138.11
    # G-L5 对齐:站点默认语言 = English,默认文案改英文;原中文文案保留为 zh 变体。
    # Wiki 中文页面由宿主经 data-language/AskAIConfig.language 传 zh(页面语言优先)。
    welcome: "Ask me anything about CamThink device docs, configuration, and troubleshooting."
    language: en
    starters:
      - "How do I get started with this device?"
      - "How do I troubleshoot an NE301 flash failure?"
      - "Are there API call examples for this device?"
      - "Where can I download firmware for this model?"
    welcome_i18n:
      zh: "有问题就问我 —— 我熟悉 CamThink 设备的文档、配置与排障步骤。"
    starters_i18n:
      zh:
        - "这篇文档对应的设备如何开始配置?"
        - "NE301 刷机失败怎么排查?"
        - "设备 API 调用有示例吗?"
        - "这个型号的固件在哪里下载?"

  - site_id: camthink-store
    display_name: CamThink Store
    allowed_origins:
      - https://store.camthink.ai
      # 外部 Widget 对接测试页 /store/(同一 Origin;路径不进授权,精确命中 scheme://host)。
      - http://42.194.138.11
    welcome: "Shopping for a CamThink device? Ask me before you order."
    language: en
    starters:
      - "Is NE503 suitable for my project?"
      - "Compare NE503 with NE301"
      - "What is included in the box?"
      - "Do you ship internationally?"
    welcome_i18n:
      zh: "正在选购 CamThink 设备?下单前可以先问我。"
    starters_i18n:
      zh:
        - "NE503 适合我的项目吗?"
        - "NE503 和 NE301 有什么区别?"
        - "包装内有哪些配件?"
        - "支持国际配送吗?"
