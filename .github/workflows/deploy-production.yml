# Production Deployment Orchestration(#10 · 生产部署编排 + v1.4.0 存量库迁移矫正)
#
# 唯一编排入口:workflow_dispatch → production Environment 审批 →
# 冻结发布身份(tag→SHA)→ release-publish Guard → Deployment=in_progress →
# 数据库迁移(发布绑定:只执行【冻结发布树】迁移清单 deploy/prod/migrations.json
# 或窄历史桥条目,在冻结发布镜像内、任何镜像代码执行前先断言镜像 RELEASE.json
# == 冻结身份;迁移失败 → 绝不 rollout)→ GitHub 托管 runner SSH → 主机侧
# flock → 既有 deploy/prod/update.sh <tag>(唯一部署原语)→ /health 运行时
# 身份双断言(version + git_sha)→ Deployment=success。
#
# 迁移所有权模型(scripts/release_migration_plan.py,杜绝按版本永久硬编码):
#   - 权威 = 冻结发布树内的迁移清单(与代码同树同 tag;清单机制存在后的每个
#     发布树必须携带,无迁移也要空列表);
#   - 历史桥 = 封闭集合,仅覆盖清单机制诞生前已冻结的发布(现仅 v1.4.0);
#     桥引用的脚本必须存在于该冻结镜像内(执行前镜像身份断言保证迁移代码
#     来源 = 冻结工件,而非 mutable main);
#   - 两者都不命中 → MIGRATION NOT REQUIRED(日志显式可辨);
#   - 迁移执行载体 = 既有 compose 一次性服务 sync(restart:no/healthcheck
#     disabled,README 同款 `run --rm sync python scripts/…`);不加服务、
#     不改 update.sh、不在主机新增任何文件;
#   - compose 显式注入 ASKAI_IMAGE_TAG=<冻结 tag>(生产 compose 的必填插值
#     守卫原样保留):pull 与 run 绑定同一冻结镜像,任何镜像代码执行前先断言
#     该镜像 RELEASE.json == 冻结身份。
#
# 触发设计:
#   - 仅 workflow_dispatch(人工发起,production Environment 人工审批;
#     ❌ 无 push/workflow_call 触发 —— 部署永不自动发生);
#   - 输入仅接受仓库中存在的精确不可变 tag vX.Y.Z 或 vX.Y.Z-rN(-rN = 同一
#     iteration 的发布重转标记,如 v1.6.3-r2;原 vX.Y.Z tag 不可变、绝不复用;
#     拒 latest/分支/SHA/其他变体);
#   - main HEAD 与发布身份无关:身份只来自 tag 的 git 解析。
#
# 失败语义(fail-closed,与硬化守卫一致):
#   - Guard 失败 → SSH 之前终止,无任何生产变更、无部署记录;
#   - 迁移失败(计划非法/镜像身份不符/迁移脚本非零退出)→ rollout 之前终止,
#     绝不更新 backend;记录收尾为 failure,绝无 success;
#   - 记录建立后的任何失败(SSH/锁/迁移/update.sh/身份不匹配/证据收尾)→
#     状态收尾为 failure,**绝不允许 success**;身份核验未通过前,
#     成功状态不存在任何代码路径;
#   - 生产可能已变更而证据收尾失败 → 打印 PRODUCTION STATE RECONCILIATION
#     REQUIRED,等待操作员对账,绝不伪造重试成功;
#   - 取消/传输不确定 = 状态非 success,production-closure 保持 fail-closed;
#     回滚 = 用上一个不可变 tag 重新 dispatch 本 workflow(无自动回滚)。
#
# break-glass 等价路径:手动 SSH + update.sh <tag> + 独立核验
# scripts/verify_runtime_identity.py → 同一 recorder(原子模式)→ 同一
# GitHub Deployment 证据模型(见 deploy/prod/update.sh 头部运行簿)。
#
# 操作员前置(仓库设置,非本仓提交数据):
#   - Environment `production`(建议 required reviewer 审批);
#   - Environment secret PROD_DEPLOY_SSH_KEY(专用部署私钥);
#   - Repository variables:PROD_SSH_HOST / PROD_SSH_USER /
#     PROD_SSH_KNOWN_HOSTS_B64(known_hosts 行的 base64,含主机公钥钉扎)/
#     可选 PROD_BACKEND_PORT(缺省 18000)。

name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "不可变发布 tag(精确 vX.Y.Z;拒 latest/分支/SHA)"
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要全部 tag 才能 git 解析 tag→commit

      # ---- 1. 校验并冻结发布身份(唯一身份源 = tag 的 git 解析) ----
      - name: Resolve and freeze release identity
        id: identity
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          if [ "$TAG" = "latest" ] || [ "$TAG" = "main" ]; then
            echo "❌ 拒绝 '$TAG':只接受精确不可变 tag vX.Y.Z(latest/分支不是发布身份)" >&2
            exit 2
          fi
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-r(0|[1-9][0-9]*))?$ ]]; then
            echo "❌ 拒绝 '$TAG':tag 必须是 vX.Y.Z 或 vX.Y.Z-rN(重转后缀;拒 latest/分支/SHA/其他变体)" >&2
            exit 2
          fi
          SHA="$(git rev-parse --verify --quiet "${TAG}^{commit}" || true)"
          if [ -z "$SHA" ] || [ "${#SHA}" -ne 40 ]; then
            echo "❌ tag $TAG 无法解析为 40 位 commit(仓库中不存在或非法)" >&2
            exit 2
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"   >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "🔒 发布身份冻结: tag=$TAG version=$VERSION sha=$SHA(此后所有核验只对这一身份)"

      # ---- 2. Pre-mutation Guard:通过之前绝不触碰生产 ----
      - name: Release-publish guard (pre-mutation)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GUARD_TAG: ${{ steps.identity.outputs.tag }}
          GUARD_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/release_integrity_check.py \
            --mode release-publish --tag "$GUARD_TAG" --expected-sha "$GUARD_SHA"

      # ---- 3. 建立在途记录(in_progress;守卫侧 ≠ success) ----
      - name: Create in_progress deployment record
        id: record_create
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REC_TAG: ${{ steps.identity.outputs.tag }}
          REC_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          OUT="$(python3 scripts/record_production_deployment.py \
            --tag "$REC_TAG" --sha "$REC_SHA" --phase create 2>&1)"
          echo "$OUT"
          DEPLOYMENT_ID="$(printf '%s\n' "$OUT" | sed -n 's/.*deployment id=\([0-9][0-9]*\).*/\1/p')"
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "❌ 在途记录已建但未取得 deployment id" >&2
            exit 1
          fi
          echo "created=true"        >> "$GITHUB_OUTPUT"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      # ---- 3.5 生产兼容性 preflight(#46;fail-closed;先于任何生产 mutation) ----
      # evaluator 与 manifest 都从冻结镜像内提取(release-owned;mutable main
      # 无法重解释历史发布)。本步骤只调用、不裁决(update.sh 不变 policy
      # engine);非零退出 ⇒ 在 DB migration(首个不可逆 mutation)之前中止,
      # 零生产变更。前契约镜像(镜像内无 evaluator)走有界兼容路径并显式留痕。
      #
      # R2-4 候选接线(语义保留):强制启用 G2 只读隔离断言;隔离子项 PASS
      # ≠ G2 门 PASS;G2 正式满足以本 workflow 在生产仓库强制生效并完成真实
      # 部署验证为准。
      #
      # R3-1 可信生产身份绑定(2026-10-20):隔离断言强制携带**独立信任锚**
      # (--isolation-trust-anchor-file):PG 用 pg_control_system().system_
      # identifier(每集群 initdb 唯一,文件级复制恢复保留生产 id = 正确语义),
      # Weaviate 用 /v1/schema 目标 collection 的 collectionId 稳定标识。
      # R2 的 current_database()==DSN dbname 与 /v1/meta hostname==URL 自洽
      # 检查保留但不再单独构成身份证据 —— 锚不匹配/缺失/不可读一律
      # fail-closed,绝不进入隔离断言。
      #
      # R3-2 SSH 凭据生命周期(2026-10-20,**消除而非清理**):R2 候选曾把
      # 隔离 DSN(PREFLIGHT_ISOLATION_PG_DSN secret)经 stdin 写入远端
      # $HOME/.askai_preflight_iso_dsn —— SSH 中断/远程 trap 未装好/清理连接
      # 失败时可残留含密文件。R3 起该路径整体移除:
      #   - CI→SSH 只传**非秘密参数**:冻结 tag(已 ^vX.Y.Z(-rN)?$ 校验)+
      #     A 带外钉扎的信任锚(base64 JSON,内容为非秘密的集群/集合唯一标识);
      #   - 生产 backend 容器环境自身已含完整 DB DSN 组件与 Weaviate 目标
      #     (POSTGRES_*/WEAVIATE_*,compose env_file+environment 注入):
      #     evaluator/manifest/锚经既有 compose exec 通道送入**运行中 backend
      #     容器**,评估器在容器内执行,凭据经容器自身 env 继承
      #     (--isolation-pg-dsn-parts / --isolation-weaviate-*-env 只传变量名)
      #     —— 零新增含密文件、零凭据过 SSH、零 CI 侧 DSN secret;
      #   - 远端/容器临时工件(评估器/manifest/锚)均**非秘密**,单 SSH 会话
      #     内 trap 确定性清除;连接中断残留亦为非秘密工件,且下次运行开始时
      #     确定性清扫(最小有效期);
      #   - 冻结镜像 evaluator、preflight 先于 migration 与 rollout、身份+
      #     隔离同一强制链、remediation gate 与无 ACK 语义、gate 三值均不变;
      #   - A-owned 输入(未配置 ⇒ fail-closed 中止,不部署):
      #       secret PREFLIGHT_TRUST_ANCHOR_B64 = trust-anchor JSON 的 base64,
      #       A 按目标 Weaviate 版本钉扎其一(R4-1 双版本,词表封闭):
      #       v1 {"version":1,"pg_system_id":"<pg_control_system 钉扎值>",
      #           "weaviate_collection_id":"<collectionId 钉扎值>"}
      #          (新版本 Weaviate:/v1/schema class 含 collectionId,数据面单层锚);
      #       v2 {"version":2,"pg_system_id":"...","weaviate_cluster_hostname":
      #           "<CLUSTER_HOSTNAME>","weaviate_image_digest":"sha256:<64hex>",
      #           "weaviate_volume_name":"<外部数据卷名>",
      #           "weaviate_volume_manifest_sha256":"<64hex>"}
      #          (生产固定 1.28.0:API 层无强唯一标识 —— 官方 spec definitions.Class
      #           与真实同版实例实测均无 collectionId/uuid → 控制面+数据面组合锚)。
      #       值由 A 只读采集一次带外提供;本地实现绝不编造生产锚。
      #       R5:manifest_sha256 采集必须用 R5 扫描脚本
      #       (scripts/weaviate_volume_manifest_scan.sh,经 stdin
      #       `sh -s /var/lib/weaviate` 送入 weaviate 容器执行);旧 GNU
      #       find -printf 管道在 BusyBox 下为空清单假哈希(e3b0c442…),
      #       修正前禁止用于采锚。
      #       ── G3 整改证据通道(A #138 P3;可选,非秘密)──
      #       secret PREFLIGHT_REMEDIATION_EVIDENCE_B64 = 整改证据工件 JSON 的
      #       base64:{version:1,gate,target_tag,evidence_digest,evidence_ref,
      #       recorded_at,recorded_by};gate 须与目标发布 manifest 声明精确一致、
      #       target_tag 须与本次部署 tag 精确绑定(evaluator fail-closed 校验)。
      #       未配置 ⇒ 回退门维持 fail-closed 阻断(现状不变);字符串
      #       确认参数(裸字符串)不再构成合法放行(A #138 P3 裁决),workflow 全文零 ack 通道。
      - name: Production compatibility preflight (fail-closed; pre-mutation)
        id: preflight
        env:
          SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ vars.PROD_SSH_HOST }}
          SSH_USER: ${{ vars.PROD_SSH_USER }}
          SSH_KNOWN_HOSTS_B64: ${{ vars.PROD_SSH_KNOWN_HOSTS_B64 }}
          DEPLOY_TAG: ${{ steps.identity.outputs.tag }}
          TRUST_ANCHOR_B64: ${{ secrets.PREFLIGHT_TRUST_ANCHOR_B64 }}
          REMEDIATION_EVIDENCE_B64: ${{ secrets.PREFLIGHT_REMEDIATION_EVIDENCE_B64 }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/prod_deploy_key"
          KH_FILE="$RUNNER_TEMP/prod_known_hosts"
          cleanup() { rm -f "$KEY_FILE" "$KH_FILE"; }
          trap cleanup EXIT INT TERM
          for v in SSH_KEY SSH_HOST SSH_USER SSH_KNOWN_HOSTS_B64 TRUST_ANCHOR_B64 DEPLOY_TAG; do
            if [ -z "${!v}" ]; then
              echo "❌ $v 未配置(production Environment secret / repository variables;" >&2
              echo "   含 A-owned 信任锚 PREFLIGHT_TRUST_ANCHOR_B64):隔离断言无法证明 → 部署中止" >&2
              exit 2
            fi
          done
          # DEPLOY_TAG 形状纵深复核(身份步已 ^vX.Y.Z(-rN)?$ 校验;远端 env
          # 前缀只接受已冻结 tag,绝不接受任意字符串)
          case "$DEPLOY_TAG" in
            v[0-9]*.[0-9]*.[0-9]*|v[0-9]*.[0-9]*.[0-9]*-r[0-9]*) ;;
            *) echo "❌ DEPLOY_TAG 形状非法(拒绝进入远端命令)" >&2; exit 2;;
          esac
          # 信任锚必须为 base64 词表内单行(防远端 env 前缀注入;锚值本身非秘密)
          case "$TRUST_ANCHOR_B64" in
            *[!A-Za-z0-9+/=]*) echo "❌ TRUST_ANCHOR_B64 含 base64 词表外字符(非法)" >&2; exit 2;;
          esac
          # 整改证据通道(A #138 P3;可选):未配置 ⇒ 回退门维持 fail-closed
          # 阻断;配置时 base64 词表内单行(防远端 env 前缀注入;工件本身非秘密)
          case "${REMEDIATION_EVIDENCE_B64:-}" in
            *[!A-Za-z0-9+/=]*) echo "❌ REMEDIATION_EVIDENCE_B64 含 base64 词表外字符(非法)" >&2; exit 2;;
          esac
          install -m 600 /dev/null "$KEY_FILE"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          printf '%s' "$SSH_KNOWN_HOSTS_B64" | base64 -d > "$KH_FILE"
          chmod 644 "$KH_FILE"
          if [ ! -s "$KH_FILE" ] || ! grep -q "$SSH_HOST" "$KH_FILE"; then
            echo "❌ known_hosts 钉扎缺失或与 PROD_SSH_HOST 不匹配(绝不关闭严格主机键校验)" >&2
            exit 2
          fi
          SSH_OPTS=(-i "$KEY_FILE"
              -o StrictHostKeyChecking=yes
              -o UserKnownHostsFile="$KH_FILE"
              -o BatchMode=yes
              -o ConnectTimeout=15
              -o ServerAliveInterval=30)
          # 单 SSH 会话执行远端 preflight(脚本本体经 stdin 原样传递,与迁移
          # 同一无注入面模式;凭据零传输 —— 见步骤断言注释)
          remote_preflight() {
            ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" \
                "DEPLOY_TAG='$DEPLOY_TAG' TRUST_ANCHOR_B64='$TRUST_ANCHOR_B64' REMEDIATION_EVIDENCE_B64='${REMEDIATION_EVIDENCE_B64:-}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/ask-ai
          exec 9>"${TMPDIR:-/tmp}/askai-deploy.lock"
          flock -w 0 9 || { echo "❌ 部署锁被占用(另一生产变更在执行)" >&2; exit 1; }
          export ASKAI_IMAGE_TAG="$DEPLOY_TAG"
          IMAGE="ghcr.io/harryhua-ai/ask-ai:$DEPLOY_TAG"
          # R4-1:COMPOSE 提前定义 —— 控制面锚核验(1.5 步)在容器 preflight 之前
          # 即需 compose ps 定位运行中 weaviate 容器(set -u 下先定义后引用)
          COMPOSE="docker compose -f deploy/prod/docker-compose.yml"
          # R3-2 确定性清扫:连接中断可能残留的上一轮临时工件(均非秘密:
          # 评估器/manifest = 冻结镜像工件,锚 = A 钉扎标识)—— 最小有效期
          rm -f "${TMPDIR:-/tmp}"/askai-trust-anchor.* "${TMPDIR:-/tmp}"/askai-preflight.* \
                "${TMPDIR:-/tmp}"/askai-compat.* "${TMPDIR:-/tmp}"/askai-release.* \
                "${TMPDIR:-/tmp}"/askai-remediation-evidence.* 2>/dev/null || true
          ANCHOR_TMP="$(mktemp "${TMPDIR:-/tmp}/askai-trust-anchor.XXXXXXXX")"
          REL_TMP="$(mktemp "${TMPDIR:-/tmp}/askai-release.XXXXXXXX")"
          MAN_TMP="$(mktemp "${TMPDIR:-/tmp}/askai-compat.XXXXXXXX")"
          EVAL_TMP="$(mktemp "${TMPDIR:-/tmp}/askai-preflight.XXXXXXXX")"
          EVID_TMP=""
          cleanup() {
            rm -f "$ANCHOR_TMP" "$REL_TMP" "$MAN_TMP" "$EVAL_TMP"
            [ -z "$EVID_TMP" ] || rm -f "$EVID_TMP"
          }
          trap cleanup EXIT
          # 1) 信任锚(base64;A 带外钉扎的非秘密标识)落远端 0600 临时文件
          printf '%s' "$TRUST_ANCHOR_B64" | base64 -d > "$ANCHOR_TMP" || {
              echo "❌ trust anchor base64 解码失败(fail-closed)" >&2; exit 1; }
          chmod 600 "$ANCHOR_TMP"
          if [ ! -s "$ANCHOR_TMP" ]; then
              echo "❌ trust anchor 为空(fail-closed)" >&2; exit 1
          fi
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$ANCHOR_TMP" 2>/dev/null || {
              echo "❌ trust anchor 非合法 JSON(fail-closed)" >&2; exit 1; }
          # 2) G3 整改证据(A #138 P3 唯一合法放行面;可选:未配置 ⇒ 回退门
          #    维持 fail-closed 阻断)。非秘密工件,同锚通道纪律:base64 →
          #    远端 0600 临时文件 → 容器 stdin → 执行前完整性核对。
          EVID_ARGS=()
          if [ -n "${REMEDIATION_EVIDENCE_B64:-}" ]; then
            EVID_TMP="$(mktemp "${TMPDIR:-/tmp}/askai-remediation-evidence.XXXXXXXX")"
            printf '%s' "$REMEDIATION_EVIDENCE_B64" | base64 -d > "$EVID_TMP" || {
                echo "❌ remediation evidence base64 解码失败(fail-closed)" >&2; exit 1; }
            chmod 600 "$EVID_TMP"
            if [ ! -s "$EVID_TMP" ]; then
                echo "❌ remediation evidence 为空(fail-closed)" >&2; exit 1
            fi
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$EVID_TMP" 2>/dev/null || {
                echo "❌ remediation evidence 非合法 JSON(fail-closed)" >&2; exit 1; }
            EVID_ARGS=(--remediation-evidence-file /tmp/askai-remediation-evidence.json)
          fi
          # 1.5) R4-1 v2 控制面锚核验(只读;两层任一不匹配 → 容器 preflight 之前
          #      中止,零 mutation):SSH 通道已被 known_hosts 钉扎;本步对运行中
          #      weaviate 容器做只读 docker inspect(镜像 config digest / 数据卷
          #      挂载 / CLUSTER_HOSTNAME env)与数据卷目录**元数据清单哈希**
          #      (文件名/大小/mtime 排序后 sha256,不读客户内容),与 A 带外钉扎
          #      值精确比对。v1 锚(新版 Weaviate collectionId 单层锚)无控制面
          #      字段 → 跳过,身份由数据面 collectionId 比对承担。诚实边界:数据
          #      卷内容钉扎后被整体原样替换且元数据恰好一致不可排除(PARTIAL)。
          #      R5 窄修:清单哈希扫描 = 非秘密脚本经 stdin 送入容器执行
          #      (逐段显式校验;空/部分清单 fail-closed 绝无哈希;stderr
          #      透传;详见 scripts/weaviate_volume_manifest_scan.sh 头部)。
          ANCHOR_VERSION="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('version'))" "$ANCHOR_TMP")"
          if [ "$ANCHOR_VERSION" = "2" ]; then
            CP_PARSE="$(python3 - "$ANCHOR_TMP" <<'PYCP'
          import json, re, sys
          a = json.load(open(sys.argv[1]))
          fields = (
              ("weaviate_image_digest", r"sha256:[0-9a-f]{64}"),
              ("weaviate_volume_name", r"[A-Za-z0-9][A-Za-z0-9_.-]{0,253}"),
              ("weaviate_cluster_hostname", r"[A-Za-z0-9][A-Za-z0-9._-]{0,253}"),
              ("weaviate_volume_manifest_sha256", r"[0-9a-f]{64}"),
          )
          vals = []
          for key, pat in fields:
              v = str(a.get(key) or "").strip()
              if not re.fullmatch(pat, v):
                  print("__INVALID__" + key)
                  sys.exit(0)
              vals.append(v)
          print(" ".join(vals))
          PYCP
          )"
            set -- $CP_PARSE
            CP_IMG="${1:-}"; CP_VOL="${2:-}"; CP_HOST="${3:-}"; CP_MAN="${4:-}"
            case "$CP_IMG" in
              __INVALID__*)
                echo "❌ 控制面:锚 v2 字段形状非法(${CP_IMG#__INVALID__})—— fail-closed" >&2; exit 1;;
              "") echo "❌ 控制面:锚 v2 字段读取失败 —— fail-closed" >&2; exit 1;;
            esac
            WID="$($COMPOSE ps -q weaviate)"
            if [ -z "$WID" ]; then
              echo "❌ 控制面:weaviate 容器未运行(compose ps 为空)—— 目标身份无法核验,fail-closed" >&2
              exit 1
            fi
            OBS_IMG="$(docker inspect "$WID" --format '{{.Image}}')"
            OBS_VOLS="$(docker inspect "$WID" --format '{{range .Mounts}}{{.Name}}={{.Destination}} {{end}}')"
            OBS_HOST="$(docker inspect "$WID" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^CLUSTER_HOSTNAME=//p' | head -n1)"
            CP_FAIL=""
            # R5(卷清单假 PASS 窄修,A 审查裁决 issuecomment-6281863560):旧
            # `find -printf … 2>/dev/null | sha256sum` 管道三缺陷(真实容器
            # r4-weaviate-128/BusyBox v1.37.0 实测):-printf 不支持、stderr
            # 被吞、空/部分清单仍输出"有效"哈希 e3b0c442… → 假 PASS。替换为
            # scripts/weaviate_volume_manifest_scan.sh(下方内嵌副本与其逐字
            # 节一致,测试钉住):非秘密脚本经 stdin 送入容器执行(同 R3
            # 脚本-via-stdin 无注入面模式);逐段显式校验,空/部分清单
            # fail-closed 绝无哈希输出,stderr 透传不隐藏。
            # A 生产锚采集必须用同一脚本同一形态(修正前禁用旧命令采锚):
            #   docker exec -i <weaviate 容器> sh -s /var/lib/weaviate < 脚本
            VOLSCAN_TMP="$(mktemp "${TMPDIR:-/tmp}/askai-volscan.XXXXXXXX")"
            cleanup() { rm -f "$ANCHOR_TMP" "$REL_TMP" "$MAN_TMP" "$EVAL_TMP" "$VOLSCAN_TMP"; }
            trap cleanup EXIT
            cat > "$VOLSCAN_TMP" <<'VOLSCAN_SH'
          #!/bin/sh
          # weaviate_volume_manifest_scan.sh — Weaviate 数据卷**元数据清单**哈希扫描。
          #
          # r3gate R5 窄修(A 审查裁决 issuecomment-6281863560):替换
          # deploy-production.yml 旧管道
          #   `find . -type f -printf "%P\t%s\t%T@\n" 2>/dev/null | LC_ALL=C sort | sha256sum`
          # 的三个确定性缺陷:
          #   1. `-printf` 是 GNU find 扩展 —— Weaviate 1.28.0 官方镜像
          #      (cr.weaviate.io/semitechnologies/weaviate,Alpine/BusyBox v1.37.0
          #      实测)不支持,报错且无输出;
          #   2. `2>/dev/null` 把扫描错误整体吞掉(失败原因不可见);
          #   3. 管道无逐段校验 —— 末环 sha256sum 对空输入仍返回有效哈希
          #      e3b0c44298fc…,空/部分清单两次扫出同一"合法"哈希 → G2 控制面
          #      假 PASS 风险(真实容器实测:非空卷上旧命令 rc=0 输出空清单哈希)。
          #
          # 语义(与 R4-1 一致,**元数据清单,绝不读文件内容**):
          #   清单 = 卷内全部常规文件的 `<路径>|<大小字节>|<mtime 自纪元秒>` 行,
          #   LC_ALL=C 排序后取 sha256。客户内容零读取;元数据清单的原理性边界
          #   (内容被整体替换而 path/size/mtime 秒级元数据恰好一致时不可辨别)
          #   如实保留为 PARTIAL 残余,本脚本不宣称排除。
          #
          # fail-closed 契约(逐段显式校验,不依赖最后一环,不隐藏 stderr):
          #   段0 卷根存在且可进入 → 段1 find 退出码显式校验 + stderr 必须为空
          #   (stderr 始终透传,且非空即判部分遍历 → fail)→ 段2 文件清单非空(-s)
          #   → 段3 逐文件 stat 成功 + size/mtime 纯数字形状校验 → 段4 sort/
          #   sha256sum 退出码显式校验 → 哈希 64-hex 形状校验 → 文件计数 ≥1。
          #   任一段失败:stderr 输出 `VOLSCAN FAIL: <原因>`(原因可见),退出码 3,
          #   stdout 绝无哈希 —— 绝不产生空/部分清单哈希。
          #
          # 成功输出(stdout 恰一行,供 runner 端机器校验;FILES≥1 = 非空清单证据):
          #   VOLSCAN_OK MANIFEST_SHA256=<64hex> FILES=<n>
          #
          # 用法(部署 workflow 经 stdin 送入 weaviate 容器,同 R3 脚本-via-stdin
          # 无注入面模式;A 生产锚采集必须使用同一脚本与同一调用形态):
          #   docker exec -i <weaviate 容器> sh -s /var/lib/weaviate < 本脚本
          #
          # 环境与已实测边界(2026-10-20,r4-weaviate-128 真实容器 BusyBox v1.37.0):
          #   - 仅依赖 busybox 多调用二进制:sh/find/stat/sha256sum/mktemp/sort/cut;
          #   - 路径按 find 换行协议:含换行的文件名不在 Weaviate 数据卷出现;含
          #     `|` 的文件名会被行形状校验(size/mtime 必须纯数字)拦截为 fail;
          #   - 000 目录使 find 部分遍历(实测 stderr + rc=1)→ fail-closed;
          #   - 000 **常规文件**的元数据(path/size/mtime)仍可 stat(元数据读取
          #     不需要文件读权限)→ 不构成扫描故障,与"元数据清单"语义一致,
          #     内容仍零读取 —— 此为元数据清单的如实边界,非隐藏错误。
          set -u

          ROOT="${1:-/var/lib/weaviate}"

          fail() {
              echo "VOLSCAN FAIL: $*" >&2
              exit 3
          }

          # 段0:卷根必须存在且可进入(目标不可达/不可进入 = fail-closed)
          [ -d "$ROOT" ] || fail "卷根目录不可达: $ROOT"
          cd "$ROOT" || fail "无法进入卷根: $ROOT"

          LIST="$(mktemp "${TMPDIR:-/tmp}/askai-volscan-list.XXXXXX")" \
              || fail "mktemp(文件清单)失败"
          META="$(mktemp "${TMPDIR:-/tmp}/askai-volscan-meta.XXXXXX")" \
              || fail "mktemp(元数据清单)失败"
          ERR="$(mktemp "${TMPDIR:-/tmp}/askai-volscan-err.XXXXXX")" \
              || fail "mktemp(stderr 捕获)失败"
          cleanup() { rm -f "$LIST" "$META" "$ERR"; }
          trap cleanup EXIT INT TERM

          # 段1:find —— 退出码显式校验;stderr 捕获后**始终透传**(绝不隐藏),
          #       且 stderr 非空即视为部分遍历(如 000 目录权限拒绝)→ fail-closed
          LC_ALL=C find . -type f -print > "$LIST" 2> "$ERR"
          FIND_RC=$?
          if [ -s "$ERR" ]; then
              cat "$ERR" >&2
          fi
          [ "$FIND_RC" -eq 0 ] || fail "find 扫描失败(rc=$FIND_RC;目标不可达/权限异常,stderr 已透传见上)"
          [ ! -s "$ERR" ] || fail "find 扫描产生错误输出(部分遍历风险,stderr 已透传见上)"

          # 段2:文件清单必须非空 —— 空/部分清单绝不产生哈希
          [ -s "$LIST" ] || fail "文件清单为空(卷内 0 个常规文件)—— 空/部分清单绝不输出哈希"

          # 段3:逐文件 stat 成功 + 行形状校验(任一失败 → fail-closed,绝无哈希)
          N=0
          while IFS= read -r F || [ -n "$F" ]; do
              [ -n "$F" ] || fail "文件清单含空行(部分扫描可疑)"
              LINE="$(stat -c '%n|%s|%Y' "$F")" \
                  || fail "stat 失败: $F(扫描期间文件消失/权限异常)"
              SZ="${LINE##*|}"
              REST="${LINE%|*}"
              MT="${REST##*|}"
              case "$SZ" in ""|*[!0-9]*) fail "size 非数字(stat 输出形状异常): $LINE" ;; esac
              case "$MT" in ""|*[!0-9]*) fail "mtime 非数字(stat 输出形状异常): $LINE" ;; esac
              printf '%s\n' "$LINE" || fail "元数据清单写出失败"
              N=$((N + 1))
          done < "$LIST" > "$META"

          # 段4:排序 + sha256sum —— 退出码显式校验(最后一环不单独信任)
          LC_ALL=C sort -o "$META" "$META" || fail "sort 失败"
          [ -s "$META" ] || fail "元数据清单为空(与文件清单不一致)—— fail-closed"
          SUM_OUT="$(sha256sum "$META")" || fail "sha256sum 失败"
          HEX="$(printf '%s\n' "$SUM_OUT" | cut -d ' ' -f1)"
          case "$HEX" in
              ????????????????????????????????????????????????????????????????) ;;
              *) fail "哈希形状异常(非 64 字符): $SUM_OUT" ;;
          esac
          case "$HEX" in
              *[!0-9a-f]*) fail "哈希含非 [0-9a-f] 字符: $HEX" ;;
          esac
          [ "$N" -ge 1 ] || fail "文件计数为 0 —— fail-closed"

          echo "VOLSCAN_OK MANIFEST_SHA256=$HEX FILES=$N"
          exit 0
          VOLSCAN_SH
            VOLSCAN_RC=0
            VOLSCAN_OUT="$(docker exec -i "$WID" sh -s /var/lib/weaviate < "$VOLSCAN_TMP")" || VOLSCAN_RC=$?
            rm -f "$VOLSCAN_TMP"
            # runner 端三重校验:远端退出码 + 输出含 64-hex 哈希 + FILES≥1
            # 非空清单证据标记;任一缺失 → OBS_MAN 为空 → 比对失败 fail-closed
            # (阻断 evaluator 与 migration;preflight 先于 migrate 已由测试钉住)
            OBS_MAN=""
            if [ "$VOLSCAN_RC" -ne 0 ]; then
              CP_FAIL="${CP_FAIL:+$CP_FAIL,}数据卷元数据扫描失败(rc=$VOLSCAN_RC;失败原因 stderr 已透传)"
            else
              OBS_MAN="$(printf '%s\n' "$VOLSCAN_OUT" | sed -n 's/^VOLSCAN_OK MANIFEST_SHA256=\([0-9a-f]\{64\}\) FILES=[1-9][0-9]*$/\1/p' | tail -n 1)"
              if [ -z "$OBS_MAN" ]; then
                CP_FAIL="${CP_FAIL:+$CP_FAIL,}数据卷扫描输出无合法证据行(需 64hex 哈希 + FILES≥1)"
              fi
            fi
            [ "$OBS_IMG" = "$CP_IMG" ] || CP_FAIL="${CP_FAIL:+$CP_FAIL,}镜像_config_digest"
            case " $OBS_VOLS " in
              *" $CP_VOL=/var/lib/weaviate "*) ;;
              *) CP_FAIL="${CP_FAIL:+$CP_FAIL,}数据卷挂载";;
            esac
            [ "$OBS_HOST" = "$CP_HOST" ] || CP_FAIL="${CP_FAIL:+$CP_FAIL,}CLUSTER_HOSTNAME"
            if [ -n "$OBS_MAN" ] && [ "$OBS_MAN" != "$CP_MAN" ]; then
              CP_FAIL="${CP_FAIL:+$CP_FAIL,}数据卷元数据清单哈希"
            fi
            if [ -n "$CP_FAIL" ]; then
              echo "❌ 控制面锚不匹配($CP_FAIL)—— 运行中 weaviate 容器与 A 带外钉扎值不一致:" >&2
              echo "   容器 preflight 与任何生产 mutation 之前中止(fail-closed)" >&2
              exit 1
            fi
            echo "控制面锚核验 PASS:镜像/数据卷/CLUSTER_HOSTNAME/卷元数据清单与钉扎值一致(只读)"
          fi
          # 2) 拉取冻结镜像;时代判定源 = 镜像内 RELEASE.json 旗标(blocker 3)
          docker pull "$IMAGE" >/dev/null
          CID=$(docker create "$IMAGE")
          docker cp "$CID:/app/RELEASE.json" "$REL_TMP" >/dev/null 2>&1 || {
              docker rm "$CID" >/dev/null 2>&1 || true
              echo "❌ 镜像内无 RELEASE.json:非版本化镜像,拒绝部署" >&2
              exit 1
          }
          ERA="$(python3 -c "import json,sys;print('contract' if json.load(open(sys.argv[1])).get('compatibility_contract') else 'pre_contract')" "$REL_TMP")"
          rm -f "$REL_TMP"
          EVAL_OK=1
          docker cp "$CID:/app/scripts/release_preflight.py" "$EVAL_TMP" >/dev/null 2>&1 || EVAL_OK=0
          if [ "$ERA" = "contract" ]; then
            # 契约期:evaluator/manifest 必须真实打包(REVIEW_1 blocker 1/3)
            if [ "$EVAL_OK" != 1 ]; then
              docker rm "$CID" >/dev/null 2>&1 || true
              echo "❌ 契约期镜像缺失 scripts/release_preflight.py(打包违约)—— fail-closed" >&2
              exit 1
            fi
            if ! docker cp "$CID:/app/deploy/prod/compatibility.json" "$MAN_TMP" >/dev/null 2>&1; then
              echo "⚠️ 镜像内未携带 deploy/prod/compatibility.json(评估器将对缺失 manifest fail-closed)" >&2
            fi
            # R4-3 审计留痕:评估器实际提取源镜像的不可变 config digest
            # (必须在 docker rm 之前捕获;日志留痕供事后核对)
            EVAL_SOURCE_IMAGE="$(docker inspect "$CID" --format '{{.Image}}' 2>/dev/null || echo unknown)"
            docker rm "$CID" >/dev/null
            # R4-3 缺陷修复①(内容完整性核验):提取侧计算 SHA-256;工件经
            # stdin 管道写入容器后、执行前逐一核对容器内实际内容哈希 ——
            # 管道损坏/写入篡改/部分写入 → 拒绝执行评估器,fail-closed 中止。
            H_EVAL="$(python3 -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$EVAL_TMP")"
            H_MAN="$(python3 -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$MAN_TMP")"
            H_ANCHOR="$(python3 -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$ANCHOR_TMP")"
            echo "PREFLIGHT EVALUATOR SOURCE IMAGE:$DEPLOY_TAG image=$EVAL_SOURCE_IMAGE"
            COMPOSE="docker compose -f deploy/prod/docker-compose.yml"
            # R3-2:评估器/manifest/锚 经既有 compose exec 通道(stdin 管道)
            # 送入运行中 backend 容器;评估器在容器内执行 —— DSN/Weaviate 目标
            # 经容器自身 env(POSTGRES_*/WEAVIATE_*)继承,零新增含密文件、
            # 零凭据过 SSH;config 检查亦直接读容器运行时 env(同源高保真)。
            $COMPOSE exec -T backend rm -f /tmp/askai-preflight-evaluator.py \
                /tmp/askai-preflight-manifest.json /tmp/askai-trust-anchor.json \
                /tmp/askai-remediation-evidence.json \
                2>/dev/null || true
            $COMPOSE exec -T backend sh -c 'cat > /tmp/askai-preflight-evaluator.py' < "$EVAL_TMP"
            $COMPOSE exec -T backend sh -c 'cat > /tmp/askai-preflight-manifest.json' < "$MAN_TMP"
            $COMPOSE exec -T backend sh -c 'cat > /tmp/askai-trust-anchor.json' < "$ANCHOR_TMP"
            if [ -n "$EVID_TMP" ]; then
              $COMPOSE exec -T backend sh -c 'cat > /tmp/askai-remediation-evidence.json' < "$EVID_TMP"
            fi
            # R4-3①容器内侧哈希核对(执行前;任一不匹配 → 拒绝执行并中止)
            INTEGRITY_OK=1
            for pair in "$H_EVAL:/tmp/askai-preflight-evaluator.py" \
                        "$H_MAN:/tmp/askai-preflight-manifest.json" \
                        "$H_ANCHOR:/tmp/askai-trust-anchor.json"; do
              WANT="${pair%%:*}"; TPATH="${pair#*:}"
              GOT="$($COMPOSE exec -T backend sh -c "sha256sum $TPATH 2>/dev/null" | cut -d' ' -f1)"
              if [ -z "$GOT" ] || [ "$GOT" != "$WANT" ]; then
                echo "❌ 容器内工件内容核验不匹配: $TPATH(管道损坏/写入篡改/部分写入)" >&2
                INTEGRITY_OK=0
              fi
            done
            if [ -n "$EVID_TMP" ]; then
              H_EVID="$(python3 -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$EVID_TMP")"
              GOT_EVID="$($COMPOSE exec -T backend sh -c "sha256sum /tmp/askai-remediation-evidence.json 2>/dev/null" | cut -d' ' -f1)"
              if [ -z "$GOT_EVID" ] || [ "$GOT_EVID" != "$H_EVID" ]; then
                echo "❌ 容器内工件内容核验不匹配: /tmp/askai-remediation-evidence.json(管道损坏/写入篡改/部分写入)" >&2
                INTEGRITY_OK=0
              fi
            fi
            if [ "$INTEGRITY_OK" != 1 ]; then
              $COMPOSE exec -T backend rm -f /tmp/askai-preflight-evaluator.py \
                  /tmp/askai-preflight-manifest.json /tmp/askai-trust-anchor.json \
                  /tmp/askai-remediation-evidence.json || true
              echo "❌ 评估器/manifest/锚/整改证据 内容完整性核验失败 —— 绝不执行,fail-closed 中止" >&2
              exit 1
            fi
            CONTAINER_RC=0
            $COMPOSE exec -T backend python3 /tmp/askai-preflight-evaluator.py \
                --manifest /tmp/askai-preflight-manifest.json \
                --verify-upload-isolation \
                --isolation-pg-dsn-parts \
                --isolation-trust-anchor-file /tmp/askai-trust-anchor.json \
                --isolation-weaviate-url-env WEAVIATE_URL \
                --isolation-weaviate-class-env WEAVIATE_CLASS_NAME \
                --release-tag "$DEPLOY_TAG" \
                ${EVID_ARGS[@]+"${EVID_ARGS[@]}"} || CONTAINER_RC=$?
            # 容器侧临时工件确定性清除(残留亦非秘密,仍清)
            $COMPOSE exec -T backend rm -f /tmp/askai-preflight-evaluator.py \
                /tmp/askai-preflight-manifest.json /tmp/askai-trust-anchor.json \
                /tmp/askai-remediation-evidence.json || true
            if [ "$CONTAINER_RC" -ne 0 ]; then
              echo "❌ 生产兼容性 preflight(容器内;含 G2 只读隔离断言 + 独立信任锚)未通过" >&2
              echo "   —— 部署中止(DB migration / rollout 之前,零生产变更)" >&2
              exit "$CONTAINER_RC"
            fi
            echo "PREFLIGHT PASS:$DEPLOY_TAG(容器内评估;凭据零 SSH 传输;"
            echo "G2 只读隔离断言含独立信任锚;先于迁移/rollout;零 mutation)"
            echo "注意:隔离子项 PASS ≠ G2 门 PASS,G2 以正式集成验收为准"
          else
            docker rm "$CID" >/dev/null 2>&1 || true
            echo "PRE-CONTRACT RELEASE:$DEPLOY_TAG(镜像 RELEASE.json 无 compatibility_contract 旗标)——"
            echo "有界兼容路径(config/host/topology/dependencies/回退兼容 各类未证明,显式 deferred)"
          fi
          REMOTE
          }
          # preflight 必须有界:看门狗到点杀 SSH → 非零退出(fail-closed),
          # 绝不允许远端悬挂把部署流水线无限期挂起。(缺省 900s;仅 runner
          # 自身 env 可覆盖用于演练/测试,Actions 部署路径无此变量 → 走缺省)
          PREFLIGHT_TIMEOUT_S="${PREFLIGHT_TIMEOUT_S:-900}"
          remote_preflight & SSH_PID=$!
          (
            sleep "$PREFLIGHT_TIMEOUT_S"
            kill -TERM "$SSH_PID" 2>/dev/null || true
          ) & WATCHDOG_PID=$!
          RC=0
          wait "$SSH_PID" || RC=$?
          kill "$WATCHDOG_PID" 2>/dev/null || true
          wait "$WATCHDOG_PID" 2>/dev/null || true
          if [ "$RC" -ne 0 ]; then
            echo "❌ 兼容性 preflight(含 G2 只读隔离断言与独立信任锚)未通过或有界超时" \
                "(R3-2:CI→SSH 零凭据传输;远端零含密文件)—— 部署中止" \
                "(DB migration / rollout 之前,零生产变更)" >&2
            exit "$RC"
          fi

      # ---- 4. 数据库迁移(发布绑定;先于依赖新 schema 的应用 rollout;失败绝不 rollout) ----
      - name: Migrate database (release-bound; before dependent app rollout)
        id: migrate
        env:
          SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ vars.PROD_SSH_HOST }}
          SSH_USER: ${{ vars.PROD_SSH_USER }}
          SSH_KNOWN_HOSTS_B64: ${{ vars.PROD_SSH_KNOWN_HOSTS_B64 }}
          DEPLOY_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          # 迁移计划只来自【冻结发布树】清单或窄历史桥(解析器 fail-closed:
          # 清单非法/条目越界/树内不存在 → 中止,绝不带病 rollout)。
          PLAN="$(python3 scripts/release_migration_plan.py \
            --tag "$DEPLOY_TAG" --sha "$RELEASE_SHA" --repo-root .)"
          if [ "$PLAN" = "NONE" ]; then
            echo "MIGRATION NOT REQUIRED:$DEPLOY_TAG 无迁移(冻结树清单为空或无历史桥条目)"
            exit 0
          fi
          KEY_FILE="$RUNNER_TEMP/prod_deploy_key"
          KH_FILE="$RUNNER_TEMP/prod_known_hosts"
          cleanup() { rm -f "$KEY_FILE" "$KH_FILE"; }
          trap cleanup EXIT
          for v in SSH_KEY SSH_HOST SSH_USER SSH_KNOWN_HOSTS_B64; do
            if [ -z "${!v}" ]; then
              echo "❌ $v 未配置(production Environment secret / repository variables)" >&2
              exit 2
            fi
          done
          install -m 600 /dev/null "$KEY_FILE"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          printf '%s' "$SSH_KNOWN_HOSTS_B64" | base64 -d > "$KH_FILE"
          chmod 644 "$KH_FILE"
          if [ ! -s "$KH_FILE" ] || ! grep -q "$SSH_HOST" "$KH_FILE"; then
            echo "❌ known_hosts 钉扎缺失或与 PROD_SSH_HOST 不匹配(绝不关闭严格主机键校验)" >&2
            exit 2
          fi
          while IFS= read -r MIG; do
            [ -z "$MIG" ] && continue
            echo "MIGRATION BEGIN:$MIG(执行环境 = 冻结镜像 $DEPLOY_TAG;任何镜像代码执行前先断言镜像身份)"
            # 数据经远端 env 前缀注入(DEPLOY_TAG 已 ^vX.Y.Z$ 校验 / RELEASE_SHA
            # 40 位 hex / MIG 经解析器白名单),脚本本体经 stdin 原样传递 ——
            # 不拼进远端命令字符串,无注入面。
            ssh -i "$KEY_FILE" \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$KH_FILE" \
                -o BatchMode=yes \
                -o ConnectTimeout=15 \
                -o ServerAliveInterval=30 \
                "${SSH_USER}@${SSH_HOST}" \
                "DEPLOY_TAG='$DEPLOY_TAG' RELEASE_SHA='$RELEASE_SHA' MIG='$MIG' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/ask-ai
          exec 9>/tmp/askai-deploy.lock
          flock -w 0 9 || { echo "❌ 部署锁被占用(另一生产变更在执行),拒绝迁移" >&2; exit 1; }
          # compose 显式注入冻结 tag:生产 compose 的 backend 系镜像 =
          # ghcr.io/…:${ASKAI_IMAGE_TAG:?…}(缺变量时 compose 直接报错,绝不
          # 静默回退 latest/默认镜像)。pull 与 run 由此绑定同一冻结镜像,
          # 其 RELEASE.json 在下一步断言 == 冻结身份。
          export ASKAI_IMAGE_TAG="$DEPLOY_TAG"
          IMAGE="ghcr.io/harryhua-ai/ask-ai:$DEPLOY_TAG"
          EXPECTED_VERSION="${DEPLOY_TAG#v}"
          echo "[migrate 1/3] 拉取镜像 $IMAGE ..."
          docker compose -f deploy/prod/docker-compose.yml pull sync >/dev/null
          echo "[migrate 2/3] 镜像内 RELEASE.json 身份断言(fail-closed;先于任何镜像代码执行)"
          CID=$(docker create "$IMAGE")
          RELEASE_TMP="$(mktemp /tmp/askai-migrate-release.XXXXXX.json)"
          docker cp "$CID:/app/RELEASE.json" "$RELEASE_TMP" || {
              docker rm "$CID" >/dev/null 2>&1 || true
              echo "❌ 镜像内无 RELEASE.json:$DEPLOY_TAG 不是版本化镜像,拒绝执行迁移"
              exit 1
          }
          docker rm "$CID" >/dev/null
          ACTUAL_VERSION=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$RELEASE_TMP")
          ACTUAL_SHA=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['git_sha'])" "$RELEASE_TMP")
          rm -f "$RELEASE_TMP"
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ] || [ "$ACTUAL_SHA" != "$RELEASE_SHA" ]; then
              echo "❌ 镜像身份 version=$ACTUAL_VERSION git_sha=$ACTUAL_SHA ≠ 冻结身份 $EXPECTED_VERSION/$RELEASE_SHA,拒绝迁移"
              exit 1
          fi
          echo "  ✅ 镜像身份一致: version=$ACTUAL_VERSION git_sha=$ACTUAL_SHA"
          echo "[migrate 3/3] 在冻结镜像内执行迁移: python $MIG"
          # PYTHONPATH=/app:镜像 WORKDIR 为 /app(backend/ 之父)。按脚本路径执行
          # `python scripts/x.py` 时 sys.path 前置的是 /app/scripts 而非 /app ——
          # run 34463498223 即在此 import 时失败(ModuleNotFoundError: backend),
          # DB 零变异。-e 注入容器内导入根,不改变 DSN 解析与发布身份语义。
          docker compose -f deploy/prod/docker-compose.yml run --rm -e PYTHONPATH=/app sync python "$MIG"
          echo "MIGRATION SUCCESS:$MIG"
          REMOTE
            echo "MIGRATION DONE:$MIG"
          done <<< "$PLAN"

      # ---- 5. 唯一部署原语:SSH → flock → update.sh(不重实现 docker 逻辑) ----
      - name: Deploy via update.sh under host-side flock
        id: deploy
        env:
          SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ vars.PROD_SSH_HOST }}
          SSH_USER: ${{ vars.PROD_SSH_USER }}
          SSH_KNOWN_HOSTS_B64: ${{ vars.PROD_SSH_KNOWN_HOSTS_B64 }}
          DEPLOY_TAG: ${{ steps.identity.outputs.tag }}
          REMEDIATION_EVIDENCE_B64: ${{ secrets.PREFLIGHT_REMEDIATION_EVIDENCE_B64 }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/prod_deploy_key"
          KH_FILE="$RUNNER_TEMP/prod_known_hosts"
          cleanup() { rm -f "$KEY_FILE" "$KH_FILE"; }
          trap cleanup EXIT
          for v in SSH_KEY SSH_HOST SSH_USER SSH_KNOWN_HOSTS_B64; do
            if [ -z "${!v}" ]; then
              echo "❌ $v 未配置(production Environment secret / repository variables)" >&2
              exit 2
            fi
          done
          install -m 600 /dev/null "$KEY_FILE"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          printf '%s' "$SSH_KNOWN_HOSTS_B64" | base64 -d > "$KH_FILE"
          chmod 644 "$KH_FILE"
          if [ ! -s "$KH_FILE" ] || ! grep -q "$SSH_HOST" "$KH_FILE"; then
            echo "❌ known_hosts 钉扎缺失或与 PROD_SSH_HOST 不匹配(绝不关闭严格主机键校验)" >&2
            exit 2
          fi
          # 整改证据通道(A #138 P3;可选):base64 词表内单行(防远端 env 前缀
          # 注入;工件本身非秘密)。未配置 ⇒ update.sh 内 回退门维持
          # fail-closed 阻断(现状不变)。
          case "${REMEDIATION_EVIDENCE_B64:-}" in
            *[!A-Za-z0-9+/=]*) echo "❌ REMEDIATION_EVIDENCE_B64 含 base64 词表外字符(非法)" >&2; exit 2;;
          esac
          # 远端命令:DEPLOY_TAG 已在身份步被 ^vX.Y.Z(-rN)?$ 校验(纯数据,单引号
          # 防远端展开);flock -w 0 = 非阻塞,已有部署在跑则立即失败,不排队不加塞。
          # 脚本本体经 stdin 原样传递(与迁移/锚同一无注入面模式);证据非秘密,
          # 远端落 0600 临时文件后透传 update.sh → evaluator,gate/target_tag 与
          # 本次部署 tag 的绑定由 evaluator fail-closed 校验。
          ssh -i "$KEY_FILE" \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$KH_FILE" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 \
              "${SSH_USER}@${SSH_HOST}" \
              "DEPLOY_TAG='$DEPLOY_TAG' REMEDIATION_EVIDENCE_B64='${REMEDIATION_EVIDENCE_B64:-}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/ask-ai
          rm -f "${TMPDIR:-/tmp}"/askai-remediation-evidence.* 2>/dev/null || true
          EVID_ARGS=()
          EVID_TMP=""
          if [ -n "${REMEDIATION_EVIDENCE_B64:-}" ]; then
            EVID_TMP="$(mktemp "${TMPDIR:-/tmp}/askai-remediation-evidence.XXXXXXXX")"
            cleanup_evid() { rm -f "$EVID_TMP"; }
            trap cleanup_evid EXIT
            printf '%s' "$REMEDIATION_EVIDENCE_B64" | base64 -d > "$EVID_TMP" || {
                echo "❌ remediation evidence base64 解码失败(fail-closed)" >&2; exit 1; }
            chmod 600 "$EVID_TMP"
            if [ ! -s "$EVID_TMP" ]; then
                echo "❌ remediation evidence 为空(fail-closed)" >&2; exit 1
            fi
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$EVID_TMP" 2>/dev/null || {
                echo "❌ remediation evidence 非合法 JSON(fail-closed)" >&2; exit 1; }
            EVID_ARGS=(--remediation-evidence-file "$EVID_TMP")
          fi
          flock -w 0 /tmp/askai-deploy.lock ./deploy/prod/update.sh "$DEPLOY_TAG" ${EVID_ARGS[@]+"${EVID_ARGS[@]}"}
          REMOTE

      # ---- 6. 运行时身份双断言:version + git_sha(与 break-glass 共用同一验证器) ----
      - name: Verify runtime identity (/health version + git_sha)
        id: verify_identity
        env:
          SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ vars.PROD_SSH_HOST }}
          SSH_USER: ${{ vars.PROD_SSH_USER }}
          SSH_KNOWN_HOSTS_B64: ${{ vars.PROD_SSH_KNOWN_HOSTS_B64 }}
          EXPECT_VERSION: ${{ steps.identity.outputs.version }}
          EXPECT_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/prod_deploy_key"
          KH_FILE="$RUNNER_TEMP/prod_known_hosts"
          cleanup() { rm -f "$KEY_FILE" "$KH_FILE"; }
          trap cleanup EXIT
          install -m 600 /dev/null "$KEY_FILE"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          printf '%s' "$SSH_KNOWN_HOSTS_B64" | base64 -d > "$KH_FILE"
          chmod 644 "$KH_FILE"
          HEALTH_FILE="$RUNNER_TEMP/prod_health.json"
          # 远端只读 curl(读取主机 .env 的 BACKEND_PORT,缺省 18000);
          # 远端命令单引号,${BACKEND_PORT:-18000} 由远端 shell 展开。
          ssh -i "$KEY_FILE" \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$KH_FILE" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 \
              "${SSH_USER}@${SSH_HOST}" \
              'set -a; . /home/ubuntu/ask-ai/.env 2>/dev/null || true; set +a; curl -sf "http://localhost:${BACKEND_PORT:-18000}/health"' \
              > "$HEALTH_FILE"
          python3 scripts/verify_runtime_identity.py \
            --expect-version "$EXPECT_VERSION" --expect-sha "$EXPECT_SHA" \
            --health-file "$HEALTH_FILE"

      # ---- 7. 双断言通过后唯一允许的成功收尾 ----
      - name: Record deployment success
        id: record_success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REC_TAG: ${{ steps.identity.outputs.tag }}
          REC_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          if ! python3 scripts/record_production_deployment.py \
              --tag "$REC_TAG" --sha "$REC_SHA" --phase success; then
            echo "⚠️ PRODUCTION STATE RECONCILIATION REQUIRED:生产可能已运行新版本," \
                 "但成功证据未落盘 —— 请用同一 recorder(原子模式或 --phase success)人工对账," \
                 "不得伪造重试成功" >&2
            exit 1
          fi

      # ---- 8. 失败收尾:任何失败路径都绝不留下 success ----
      - name: Finalize failure (never success)
        id: record_failure
        if: >-
          failure() &&
          steps.record_create.outputs.created == 'true' &&
          steps.record_success.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REC_TAG: ${{ steps.identity.outputs.tag }}
          REC_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          if ! python3 scripts/record_production_deployment.py \
              --tag "$REC_TAG" --sha "$REC_SHA" --phase failure; then
            echo "⚠️ PRODUCTION STATE RECONCILIATION REQUIRED:生产状态可能已变化" \
                 "而失败证据未落盘,需操作员对账(production-closure 保持 fail-closed)" >&2
            exit 1
          fi
          echo "已收尾为 failure:守卫侧非 success 一律 fail-closed,production-closure 不放行"

      # ---- 9. 清理 SSH 材料(防御性;deploy/verify 步已有 trap) ----
      - name: Cleanup
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/prod_deploy_key" "$RUNNER_TEMP/prod_known_hosts" "$RUNNER_TEMP/prod_health.json"
