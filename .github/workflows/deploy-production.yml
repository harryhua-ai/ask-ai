                      try:
                          same = (hash_name(NAME) == H)
                      except OSError:
                          same = False
                  else:
                      same = False
                  xclose(tfd); unlink_own(TMP, tst); xclose(fd1)
                  if same: die("__G3_RACE_ALIGNED__", 0)
                  die("__G3_RACE_CONFLICT__")
              except OSError:
                  xclose(tfd); unlink_own(TMP, tst); xclose(fd1); die("__G3_WRITE_FAIL__")
              xclose(tfd)
              pst = probe_name(NAME)
              if not (isinstance(pst, os.stat_result) and pst.st_dev == tst.st_dev and pst.st_ino == tst.st_ino):
                  xclose(fd1); die("__G3_PUBLISH_UNVERIFIED__")
              if not unlink_own(TMP, tst):
                  xclose(fd1); die("__G3_TMP_LEFT__")
              xclose(fd1)
              print("__G3_CREATED__ ident=%d:%d" % (tst.st_dev, tst.st_ino))
              sys.exit(0)
