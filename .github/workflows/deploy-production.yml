            # (下方显式 fail-closed),异常文本不回显
            DEPLOYED_VERSION="$($COMPOSE exec -T backend cat /app/RELEASE.json 2>/dev/null | python3 -c 'import json,sys; print(str((json.load(sys.stdin) or {}).get("version") or ""))' 2>/dev/null || true)"
            if [ -z "$DEPLOYED_VERSION" ]; then
              echo "❌ 控制面:已部署版本不可读(运行中 backend /app/RELEASE.json)——" >&2
              echo "   previous_compatible=false 的回滚方向无法判定,fail-closed" >&2
              exit 1
            fi
            echo "控制面核验 PASS(c):已部署版本 = $DEPLOYED_VERSION(只读;回滚方向判定输入)"
            # 3) R4-3① 内容完整性核验(提取侧 SHA-256 → 容器内侧哈希核对)
            H_EVAL="$(python3 -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$EVAL_TMP")"
            H_MAN="$(python3 -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$MAN_TMP")"
            H_ID="$(python3 -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$ID_TMP")"
            H_GUARD="$(python3 -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$GUARD_TMP")"
            $COMPOSE exec -T backend rm -f /tmp/askai-preflight-evaluator.py \
                /tmp/askai-preflight-manifest.json /tmp/askai-production-identity.json 2>/dev/null || true
            $COMPOSE exec -T backend sh -c 'cat > /tmp/askai-preflight-evaluator.py' < "$EVAL_TMP"
            $COMPOSE exec -T backend sh -c 'cat > /tmp/askai-preflight-manifest.json' < "$MAN_TMP"
            $COMPOSE exec -T backend sh -c 'cat > /tmp/askai-production-identity.json' < "$ID_TMP"
            # 冻结守卫送达(A 评审 D1/D2 修正 2026-10-23):单次容器内 python
            # 执行(旧 r2 backend 自带 python3,零新增依赖)——
            #   fd 链式解析:自 / 逐级 O_NOFOLLOW|O_DIRECTORY openat,父目录
            #   身份固定为已打开 inode,其后创建/链接/清理全部 dir_fd 相对,
