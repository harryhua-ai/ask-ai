          remote_preflight & SSH_PID=$!
          (
            sleep "$PREFLIGHT_TIMEOUT_S"
            kill -TERM "$SSH_PID" 2>/dev/null || true
          ) & WATCHDOG_PID=$!
          RC=0
          wait "$SSH_PID" || RC=$?
          kill "$WATCHDOG_PID" 2>/dev/null || true
          wait "$WATCHDOG_PID" 2>/dev/null || true
          if [ "$RC" -ne 0 ]; then
            echo "❌ 兼容性 preflight(数据隔离断言 + 已审核身份事实 + deployed-version 守卫)未通过或有界超时" \
                "(CI→SSH 零凭据传输;远端零含密文件)—— 部署中止" \
                "(DB migration / rollout 之前,零生产变更)" >&2
            exit "$RC"
          fi

      # ---- 3.6 宿主部署脚本受信分发与身份钉扎(先于 DB migration 与 rollout;阻塞 2 修复)----
      # 宿主 ~/ask-ai 非 git 仓库,update.sh 不会随主干/镜像自动升级;若保留
      # 旧版,要到步骤5 才因未知参数失败 —— 已过 migration 边界,违反
      # "能力不匹配在 mutation 前 fail-closed"。本步骤把受信脚本工件
      # (= 冻结发行树 $RELEASE_SHA 内的 deploy/prod/update.sh,经 git 权威
      # 解析,不以 runner 工作区文件为准)经 SSH stdin 安全分发到宿主:
      # 同目录临时文件(0600)→ 宿主侧 SHA256 核对(传输中断/截断 ⇒ 拒绝)→
      # 能力断言(ASKAI_DEPLOYED_VERSION_GUARD_V1 回滚守卫 / --pinned-update-sh-sha256
      # 锁内自验)→ bash -n 语法校验 → 同目录原子 rename 安装(无半更新窗口)→
      # 安装后哈希复核。任何失败 ⇒ 在 DB migration 之前中止,旧脚本原状
      # 保留。持有与部署同一把宿主 flock 锁,与并发部署互斥。
      # R6v3(阻塞 3)语义:provision 只负责安装与钉扎哈希来源(git 权威
      # 解析);"安装后 → 执行前"的漂移由 update.sh 在【自身 flock 持有区间
      # 内、任何 rollout mutation 前】的锁内自验([1.2/6])拦截 —— 锁外
      # 预复核已删除(校验+执行同锁区间原子完成)。诚实边界:DB migration
      # 由冻结镜像一次性容器执行、不依赖宿主 update.sh ⇒ 迁移与部署之间
      # 的宿主脚本漂移只会导致 rollout 被 [1.2/6] fail-closed 拒绝
      # (migration 本身不受宿主脚本影响)。
      # 凭据零额外传输(SSH key 仅进 0600 临时件);
      # SSH host-key 钉扎/严格校验不变。
      - name: Provision trusted update.sh to host (before migration/rollout; atomic)
        id: provision_host_script
        env:
          SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ vars.PROD_SSH_HOST }}
          SSH_USER: ${{ vars.PROD_SSH_USER }}
          SSH_KNOWN_HOSTS_B64: ${{ vars.PROD_SSH_KNOWN_HOSTS_B64 }}
          RELEASE_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/prod_deploy_key"
          KH_FILE="$RUNNER_TEMP/prod_known_hosts"
          cleanup() { rm -f "$KEY_FILE" "$KH_FILE"; }
          trap cleanup EXIT
          for v in SSH_KEY SSH_HOST SSH_USER SSH_KNOWN_HOSTS_B64 RELEASE_SHA; do
            if [ -z "${!v}" ]; then
              echo "❌ $v 未配置(production Environment secret / repository variables)" >&2
              exit 2
            fi
          done
          case "$RELEASE_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "❌ RELEASE_SHA 形状非法(须为 40 位 hex)" >&2; exit 2;;
          esac
          install -m 600 /dev/null "$KEY_FILE"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          printf '%s' "$SSH_KNOWN_HOSTS_B64" | base64 -d > "$KH_FILE"
          chmod 644 "$KH_FILE"
          if [ ! -s "$KH_FILE" ] || ! grep -q "$SSH_HOST" "$KH_FILE"; then
            echo "❌ known_hosts 钉扎缺失或与 PROD_SSH_HOST 不匹配(绝不关闭严格主机键校验)" >&2
            exit 2
          fi
          # 受信工件内容 = git 权威解析($RELEASE_SHA 冻结树),工作区文件仅作
          # checkout 完整性对照;哈希在 runner 与宿主两侧独立计算核对。
          TRUSTED_HASH="$(git show "$RELEASE_SHA:deploy/prod/update.sh" | python3 -c 'import hashlib,sys;print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest())')"
          WORKTREE_HASH="$(python3 -c 'import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' deploy/prod/update.sh)"
          if [ "$TRUSTED_HASH" != "$WORKTREE_HASH" ]; then
            echo "❌ runner 工作区 update.sh 与冻结发行树($RELEASE_SHA)不一致(脏树/篡改)—— 迁移前中止" >&2
            exit 2
          fi
          echo "TRUSTED UPDATE.SH: release=$RELEASE_SHA sha256=$TRUSTED_HASH"
          # 受信脚本本体 = 单行 base64 经 env 前缀传输(与整改证据同通道纪律;
          # heredoc 只携带脚本本体,工件内容绝不与控制脚本共用 stdin —— 防
          # bash -s 逐命令读取时被内层 cat 自吞)。base64 词表内单行,无注入面。
          TRUSTED_UPDATE_SH_B64="$(git show "$RELEASE_SHA:deploy/prod/update.sh" | base64 | tr -d '\n')"
          case "$TRUSTED_UPDATE_SH_B64" in
            *[!A-Za-z0-9+/=]*) echo "❌ TRUSTED_UPDATE_SH_B64 含 base64 词表外字符(非法)" >&2; exit 2;;
          esac
          ssh -i "$KEY_FILE" \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$KH_FILE" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 \
              "${SSH_USER}@${SSH_HOST}" \
              "PROVISION_SHA256='$TRUSTED_HASH' TRUSTED_UPDATE_SH_B64='$TRUSTED_UPDATE_SH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/ask-ai
          # 上一轮可能残留的安装临时件(非秘密)确定性清扫
          rm -f deploy/prod/.update-sh.provision.* 2>/dev/null || true
          # 与部署同一把宿主锁(非阻塞;与并发部署/更新互斥)
          exec 9>/tmp/askai-deploy.lock
          flock -w 0 9 || { echo "❌ 部署锁被占用(另一生产变更在执行)" >&2; exit 1; }
          TARGET="deploy/prod/update.sh"
          TMP_INST="$(mktemp deploy/prod/.update-sh.provision.XXXXXXXX)"
          cleanup() { rm -f "$TMP_INST"; }
          trap cleanup EXIT
          # 1) 受信脚本 base64 解码落同目录 0600 临时文件(传输中断/截断 ⇒
          #    解码失败或内容为空,安装前拒绝)
          printf '%s' "$TRUSTED_UPDATE_SH_B64" | base64 -d > "$TMP_INST" || {
            echo "❌ 受信 update.sh base64 解码失败(fail-closed)" >&2; exit 1; }
          chmod 600 "$TMP_INST"
          if [ ! -s "$TMP_INST" ]; then
            echo "❌ 受信 update.sh 传输为空(fail-closed)" >&2; exit 1
          fi
          # 2) 宿主侧哈希核对(传输中断/截断/篡改 ⇒ 拒绝安装,旧脚本原状)
          GOT_HASH="$(python3 -c 'import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "$TMP_INST")"
          if [ "$GOT_HASH" != "$PROVISION_SHA256" ]; then
            echo "❌ 受信 update.sh 哈希不匹配(传输中断/截断/篡改): got=$GOT_HASH want=$PROVISION_SHA256 —— 安装被拒绝,旧脚本原状保留,迁移前中止" >&2
            exit 1
          fi
          # 3) 能力断言:必须支持 deployed-version 回滚守卫与 R6v3 锁内自验
          #    旗标(契约面;哈希钉扎之外的独立能力证明,不依赖哈希知识)。
          #    2026-10-22 通道适配:整改证据参数能力断言由回滚守卫标记取代。
          if ! grep -q 'ASKAI_DEPLOYED_VERSION_GUARD_V1' "$TMP_INST"; then
            echo "❌ 受信工件缺少 deployed-version 回滚守卫能力(ASKAI_DEPLOYED_VERSION_GUARD_V1,版本过旧)—— 安装被拒绝,迁移前中止" >&2
            exit 1
          fi
          if ! grep -q -- '--pinned-update-sh-sha256' "$TMP_INST"; then
            echo "❌ 受信工件缺少锁内自验能力(--pinned-update-sh-sha256,版本过旧)—— 安装被拒绝,迁移前中止" >&2
            exit 1
          fi
          bash -n "$TMP_INST" || { echo "❌ 受信 update.sh 语法校验失败 —— 迁移前中止" >&2; exit 1; }
          # 4) 原子安装(同目录 rename ⇒ 无半更新窗口);权限 0750
          chmod 750 "$TMP_INST"
          mv -f "$TMP_INST" "$TARGET"
          NEW_HASH="$(python3 -c 'import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "$TARGET")"
          if [ "$NEW_HASH" != "$PROVISION_SHA256" ]; then
            echo "❌ 安装后哈希不匹配 —— fail-closed" >&2
            exit 1
          fi
          echo "HOST SCRIPT PROVISIONED: sha256=$NEW_HASH(原子替换完成;能力=回滚守卫+锁内自验;先于 DB migration 与 rollout;本步骤自身为受校验的宿主脚本变更)"
          REMOTE

      # ---- 4. 数据库迁移(发布绑定;先于依赖新 schema 的应用 rollout;失败绝不 rollout) ----
      - name: Migrate database (release-bound; before dependent app rollout)
        id: migrate
        env:
          SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ vars.PROD_SSH_HOST }}
          SSH_USER: ${{ vars.PROD_SSH_USER }}
          SSH_KNOWN_HOSTS_B64: ${{ vars.PROD_SSH_KNOWN_HOSTS_B64 }}
          DEPLOY_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          # 迁移计划只来自【冻结发布树】清单或窄历史桥(解析器 fail-closed:
          # 清单非法/条目越界/树内不存在 → 中止,绝不带病 rollout)。
          PLAN="$(python3 scripts/release_migration_plan.py \
            --tag "$DEPLOY_TAG" --sha "$RELEASE_SHA" --repo-root .)"
          if [ "$PLAN" = "NONE" ]; then
            echo "MIGRATION NOT REQUIRED:$DEPLOY_TAG 无迁移(冻结树清单为空或无历史桥条目)"
            exit 0
          fi
          KEY_FILE="$RUNNER_TEMP/prod_deploy_key"
          KH_FILE="$RUNNER_TEMP/prod_known_hosts"
          cleanup() { rm -f "$KEY_FILE" "$KH_FILE"; }
          trap cleanup EXIT
          for v in SSH_KEY SSH_HOST SSH_USER SSH_KNOWN_HOSTS_B64; do
            if [ -z "${!v}" ]; then
              echo "❌ $v 未配置(production Environment secret / repository variables)" >&2
              exit 2
            fi
          done
          install -m 600 /dev/null "$KEY_FILE"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          printf '%s' "$SSH_KNOWN_HOSTS_B64" | base64 -d > "$KH_FILE"
          chmod 644 "$KH_FILE"
          if [ ! -s "$KH_FILE" ] || ! grep -q "$SSH_HOST" "$KH_FILE"; then
            echo "❌ known_hosts 钉扎缺失或与 PROD_SSH_HOST 不匹配(绝不关闭严格主机键校验)" >&2
            exit 2
          fi
          while IFS= read -r MIG; do
            [ -z "$MIG" ] && continue
            echo "MIGRATION BEGIN:$MIG(执行环境 = 冻结镜像 $DEPLOY_TAG;任何镜像代码执行前先断言镜像身份)"
            # 数据经远端 env 前缀注入(DEPLOY_TAG 已 ^vX.Y.Z$ 校验 / RELEASE_SHA
            # 40 位 hex / MIG 经解析器白名单),脚本本体经 stdin 原样传递 ——
            # 不拼进远端命令字符串,无注入面。
            ssh -i "$KEY_FILE" \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$KH_FILE" \
                -o BatchMode=yes \
                -o ConnectTimeout=15 \
                -o ServerAliveInterval=30 \
                "${SSH_USER}@${SSH_HOST}" \
                "DEPLOY_TAG='$DEPLOY_TAG' RELEASE_SHA='$RELEASE_SHA' MIG='$MIG' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/ask-ai
          exec 9>/tmp/askai-deploy.lock
          flock -w 0 9 || { echo "❌ 部署锁被占用(另一生产变更在执行),拒绝迁移" >&2; exit 1; }
          # compose 显式注入冻结 tag:生产 compose 的 backend 系镜像 =
          # ghcr.io/…:${ASKAI_IMAGE_TAG:?…}(缺变量时 compose 直接报错,绝不
          # 静默回退 latest/默认镜像)。pull 与 run 由此绑定同一冻结镜像,
          # 其 RELEASE.json 在下一步断言 == 冻结身份。
          export ASKAI_IMAGE_TAG="$DEPLOY_TAG"
          IMAGE="ghcr.io/harryhua-ai/ask-ai:$DEPLOY_TAG"
          EXPECTED_VERSION="${DEPLOY_TAG#v}"
          echo "[migrate 1/3] 拉取镜像 $IMAGE ..."
          docker compose -f deploy/prod/docker-compose.yml pull sync >/dev/null
          echo "[migrate 2/3] 镜像内 RELEASE.json 身份断言(fail-closed;先于任何镜像代码执行)"
          CID=$(docker create "$IMAGE")
          RELEASE_TMP="$(mktemp /tmp/askai-migrate-release.XXXXXX.json)"
          docker cp "$CID:/app/RELEASE.json" "$RELEASE_TMP" || {
              docker rm "$CID" >/dev/null 2>&1 || true
              echo "❌ 镜像内无 RELEASE.json:$DEPLOY_TAG 不是版本化镜像,拒绝执行迁移"
              exit 1
          }
          docker rm "$CID" >/dev/null
          ACTUAL_VERSION=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$RELEASE_TMP")
          ACTUAL_SHA=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['git_sha'])" "$RELEASE_TMP")
          rm -f "$RELEASE_TMP"
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ] || [ "$ACTUAL_SHA" != "$RELEASE_SHA" ]; then
              echo "❌ 镜像身份 version=$ACTUAL_VERSION git_sha=$ACTUAL_SHA ≠ 冻结身份 $EXPECTED_VERSION/$RELEASE_SHA,拒绝迁移"
              exit 1
          fi
          echo "  ✅ 镜像身份一致: version=$ACTUAL_VERSION git_sha=$ACTUAL_SHA"
          echo "[migrate 3/3] 在冻结镜像内执行迁移: python $MIG"
          # PYTHONPATH=/app:镜像 WORKDIR 为 /app(backend/ 之父)。按脚本路径执行
          # `python scripts/x.py` 时 sys.path 前置的是 /app/scripts 而非 /app ——
          # run 34463498223 即在此 import 时失败(ModuleNotFoundError: backend),
          # DB 零变异。-e 注入容器内导入根,不改变 DSN 解析与发布身份语义。
          docker compose -f deploy/prod/docker-compose.yml run --rm -e PYTHONPATH=/app sync python "$MIG"
          echo "MIGRATION SUCCESS:$MIG"
          REMOTE
            echo "MIGRATION DONE:$MIG"
          done <<< "$PLAN"

      # ---- 5. 唯一部署原语:SSH → update.sh(内部持锁 + 锁内自验;不重实现 docker 逻辑) ----
      - name: Deploy via update.sh (self-locked; pinned-hash self-verify pre-mutation)
        id: deploy
        env:
          SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ vars.PROD_SSH_HOST }}
          SSH_USER: ${{ vars.PROD_SSH_USER }}
          SSH_KNOWN_HOSTS_B64: ${{ vars.PROD_SSH_KNOWN_HOSTS_B64 }}
          DEPLOY_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/prod_deploy_key"
          KH_FILE="$RUNNER_TEMP/prod_known_hosts"
          cleanup() { rm -f "$KEY_FILE" "$KH_FILE"; }
          trap cleanup EXIT INT TERM
          install -m 600 /dev/null "$KEY_FILE"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          printf '%s' "$SSH_KNOWN_HOSTS_B64" | base64 -d > "$KH_FILE"
          chmod 644 "$KH_FILE"
          if [ ! -s "$KH_FILE" ] || ! grep -q "$SSH_HOST" "$KH_FILE"; then
            echo "❌ known_hosts 钉扎缺失或与 PROD_SSH_HOST 不匹配(绝不关闭严格主机键校验)" >&2
            exit 2
          fi
          # 受信工件哈希(git 冻结发行树权威解析;经 env 前缀传入 update.sh,
          # 由其在【自身 flock 持有区间内、任何 mutation 前】做锁内自验 ——
          # R6v3 阻塞 3:「校验 + 执行」在同一锁持有区间内原子完成)。
          PROVISION_SHA256="$(git show "$RELEASE_SHA:deploy/prod/update.sh" | python3 -c 'import hashlib,sys;print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest())')"
          # 远端命令:DEPLOY_TAG 已在身份步被 ^vX.Y.Z(-rN)?$ 校验(纯数据,单引号
          # 防远端展开)。脚本本体经 stdin 原样传递(无注入面模式)。2026-10-22
          # 通道适配:整改证据/公钥通道整体移除(四 PREFLIGHT_* secret 退出发布
          # 依赖);不安全旧版回滚由 update.sh [1.3/6] deployed-version 守卫
          # 与 preflight evaluator deployed-version 断言双道强制。
          ssh -i "$KEY_FILE" \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$KH_FILE" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 \
              "${SSH_USER}@${SSH_HOST}" \
              "DEPLOY_TAG='$DEPLOY_TAG' PROVISION_SHA256='$PROVISION_SHA256' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/ask-ai
          # 唯一部署原语;宿主锁由 update.sh 自身持有(内部 flock,[1.1/6]),
          # 锁内自验 --pinned-update-sh-sha256([1.2/6])与 deployed-version
          # 回滚守卫([1.3/6])先于任何 mutation。
          ./deploy/prod/update.sh "$DEPLOY_TAG" \
              --pinned-update-sh-sha256 "$PROVISION_SHA256"
          REMOTE

      - name: Verify runtime identity (/health version + git_sha)
        id: verify_identity
        env:
          SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ vars.PROD_SSH_HOST }}
          SSH_USER: ${{ vars.PROD_SSH_USER }}
          SSH_KNOWN_HOSTS_B64: ${{ vars.PROD_SSH_KNOWN_HOSTS_B64 }}
          EXPECT_VERSION: ${{ steps.identity.outputs.version }}
          EXPECT_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/prod_deploy_key"
          KH_FILE="$RUNNER_TEMP/prod_known_hosts"
          cleanup() { rm -f "$KEY_FILE" "$KH_FILE"; }
          trap cleanup EXIT
          install -m 600 /dev/null "$KEY_FILE"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          printf '%s' "$SSH_KNOWN_HOSTS_B64" | base64 -d > "$KH_FILE"
          chmod 644 "$KH_FILE"
          HEALTH_FILE="$RUNNER_TEMP/prod_health.json"
          # 远端只读 curl(读取主机 .env 的 BACKEND_PORT,缺省 18000);
          # 远端命令单引号,${BACKEND_PORT:-18000} 由远端 shell 展开。
          ssh -i "$KEY_FILE" \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$KH_FILE" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 \
              "${SSH_USER}@${SSH_HOST}" \
              'set -a; . /home/ubuntu/ask-ai/.env 2>/dev/null || true; set +a; curl -sf "http://localhost:${BACKEND_PORT:-18000}/health"' \
              > "$HEALTH_FILE"
          python3 scripts/verify_runtime_identity.py \
            --expect-version "$EXPECT_VERSION" --expect-sha "$EXPECT_SHA" \
            --health-file "$HEALTH_FILE"

      # ---- 7. 双断言通过后唯一允许的成功收尾 ----
      - name: Record deployment success
        id: record_success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REC_TAG: ${{ steps.identity.outputs.tag }}
          REC_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          if ! python3 scripts/record_production_deployment.py \
              --tag "$REC_TAG" --sha "$REC_SHA" --phase success; then
            echo "⚠️ PRODUCTION STATE RECONCILIATION REQUIRED:生产可能已运行新版本," \
                 "但成功证据未落盘 —— 请用同一 recorder(原子模式或 --phase success)人工对账," \
                 "不得伪造重试成功" >&2
            exit 1
          fi

      # ---- 8. 失败收尾:任何失败路径都绝不留下 success ----
      - name: Finalize failure (never success)
        id: record_failure
        if: >-
          failure() &&
          steps.record_create.outputs.created == 'true' &&
          steps.record_success.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REC_TAG: ${{ steps.identity.outputs.tag }}
          REC_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          if ! python3 scripts/record_production_deployment.py \
              --tag "$REC_TAG" --sha "$REC_SHA" --phase failure; then
            echo "⚠️ PRODUCTION STATE RECONCILIATION REQUIRED:生产状态可能已变化" \
                 "而失败证据未落盘,需操作员对账(production-closure 保持 fail-closed)" >&2
            exit 1
          fi
          echo "已收尾为 failure:守卫侧非 success 一律 fail-closed,production-closure 不放行"

      # ---- 9. 清理 SSH 材料(防御性;deploy/verify 步已有 trap) ----
      - name: Cleanup
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/prod_deploy_key" "$RUNNER_TEMP/prod_known_hosts" "$RUNNER_TEMP/prod_health.json"
