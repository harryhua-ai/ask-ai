            GUARD_TARGET="$(python3 -c 'import json,re,sys; v=str(json.load(open(sys.argv[1])).get("uploads_unknown_guard") or ""); print(v if (re.fullmatch(r"/[A-Za-z0-9][A-Za-z0-9._/-]{0,254}", v) and ".." not in v) else "")' "$ID_TMP")"
