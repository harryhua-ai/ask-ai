            ID_DIGEST="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['weaviate_image_digest'])" "$ID_TMP")"
            ID_VOL="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['weaviate_volume_name'])" "$ID_TMP")"
            ID_HOST="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['weaviate_cluster_hostname'])" "$ID_TMP")"
            ID_UPVol="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('uploads_volume_name',''))" "$ID_TMP")"
            ID_UPMount="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('uploads_mount_path',''))" "$ID_TMP")"
            # 守卫送达目标 = 身份事实声明的绝对路径(冻结语义,不得改写/绕过):
