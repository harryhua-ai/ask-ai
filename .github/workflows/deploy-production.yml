            #   目标身份 ident=dev:ino 随 token 回传宿主,供 D2 精确回收。
            GUARD_OWN=0
            GUARD_IDENT=""
            GUARD_STATUS="$($COMPOSE exec -T backend python3 -c 'exec(__import__("textwrap").dedent("""
              # askai-guard-delivery-v2
              import os, sys, errno, hashlib, stat
              T = sys.argv[1]; H = sys.argv[2]
              D = os.path.dirname(T); NAME = os.path.basename(T)
              PREFIX = ".askai-guard-new-"
              def die(tok, rc=9):
                  print(tok); sys.exit(rc)
              def xclose(fd):
                  if fd is None: return
                  try: os.close(fd)
                  except OSError: pass
              WALK_ERRNO = [None]
              def walk_to_parent():
                  fd = os.open("/", os.O_RDONLY | os.O_DIRECTORY)
                  try:
                      for comp in [c for c in D.split("/") if c]:
                          nfd = os.open(comp, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
                          xclose(fd); fd = nfd
                      return fd
                  except OSError as exc:
                      WALK_ERRNO[0] = exc.errno
                      xclose(fd); return None
              def parent_fail_tok():
                  if WALK_ERRNO[0] == errno.ELOOP: return "__G3_PARENT_SYMLINK__"
                  try:
                      fd = os.open("/", os.O_RDONLY | os.O_DIRECTORY)
                      try:
                          for comp in [c for c in D.split("/") if c]:
                              try:
                                  os.readlink(comp, dir_fd=fd)
                              except OSError:
                                  pass
                              else:
                                  return "__G3_PARENT_SYMLINK__"
                              nfd = os.open(comp, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
                              xclose(fd); fd = nfd
                      finally:
                          xclose(fd)
                  except OSError:
                      pass
                  return "__G3_PARENT_NOT_DIR__"
              fd1 = walk_to_parent()
              if fd1 is None:
                  die(parent_fail_tok())
              st1 = os.fstat(fd1)
              fd2 = walk_to_parent()
              if fd2 is None or os.fstat(fd2).st_dev != st1.st_dev or os.fstat(fd2).st_ino != st1.st_ino:
                  xclose(fd1); xclose(fd2)
                  die("__G3_PARENT_UNSTABLE__")
              xclose(fd2)
              def probe_name(name):
                  try:
                      f = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=fd1)
                  except FileNotFoundError:
                      return None
                  except OSError:
                      return "link_or_special"
                  try:
                      return os.fstat(f)
                  finally:
                      xclose(f)
              def hash_name(name):
                  f = os.open(name, os.O_RDONLY | os.O_NOFOLLOW, dir_fd=fd1)
                  try:
                      hh = hashlib.sha256(); off = 0
                      while True:
                          b = os.pread(f, 65536, off)
                          if not b: break
                          hh.update(b); off += len(b)
                      return hh.hexdigest()
                  finally:
                      xclose(f)
              def unlink_own(name, own):
                  try:
                      f = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=fd1)
                  except OSError:
                      return False
                  try:
                      s = os.fstat(f)
                  finally:
                      xclose(f)
                  if not stat.S_ISREG(s.st_mode) or s.st_dev != own.st_dev or s.st_ino != own.st_ino:
                      return False
                  try:
                      os.unlink(name, dir_fd=fd1); return True
                  except OSError:
                      return False
              cur = probe_name(NAME)
              if cur == "link_or_special":
                  xclose(fd1); die("__G3_SYMLINK__")
              if cur is not None:
                  try:
                      same = (hash_name(NAME) == H)
                  except OSError:
                      same = False
                  xclose(fd1)
                  if same: die("__G3_REUSE__", 0)
                  die("__G3_CONFLICT__")
              TMP = PREFIX + str(os.getpid())
