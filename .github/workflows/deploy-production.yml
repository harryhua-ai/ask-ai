# Production Deployment Orchestration(#10 · 生产部署编排 + v1.4.0 存量库迁移矫正)
#
# 唯一编排入口:workflow_dispatch → production Environment 审批 →
# 冻结发布身份(tag→SHA)→ release-publish Guard → Deployment=in_progress →
# 数据库迁移(发布绑定:只执行【冻结发布树】迁移清单 deploy/prod/migrations.json
# 或窄历史桥条目,在冻结发布镜像内、任何镜像代码执行前先断言镜像 RELEASE.json
# == 冻结身份;迁移失败 → 绝不 rollout)→ GitHub 托管 runner SSH →
# 既有 deploy/prod/update.sh <tag>(唯一部署原语;宿主锁由脚本自身在内部
# flock 持有,R6v3 起锁内先自验 --pinned-update-sh-sha256 再任何 mutation)
# → /health 运行时身份双断言(version + git_sha)→ Deployment=success。
#
# 迁移所有权模型(scripts/release_migration_plan.py,杜绝按版本永久硬编码):
#   - 权威 = 冻结发布树内的迁移清单(与代码同树同 tag;清单机制存在后的每个
#     发布树必须携带,无迁移也要空列表);
#   - 历史桥 = 封闭集合,仅覆盖清单机制诞生前已冻结的发布(现仅 v1.4.0);
#     桥引用的脚本必须存在于该冻结镜像内(执行前镜像身份断言保证迁移代码
#     来源 = 冻结工件,而非 mutable main);
#   - 两者都不命中 → MIGRATION NOT REQUIRED(日志显式可辨);
#   - 迁移执行载体 = 既有 compose 一次性服务 sync(restart:no/healthcheck
#     disabled,README 同款 `run --rm sync python scripts/…`);不加服务、
#     不改 update.sh、不在主机新增任何文件;
#   - compose 显式注入 ASKAI_IMAGE_TAG=<冻结 tag>(生产 compose 的必填插值
#     守卫原样保留):pull 与 run 绑定同一冻结镜像,任何镜像代码执行前先断言
#     该镜像 RELEASE.json == 冻结身份。
#
# 触发设计:
#   - 仅 workflow_dispatch(人工发起,production Environment 人工审批;
#     ❌ 无 push/workflow_call 触发 —— 部署永不自动发生);
#   - 输入仅接受仓库中存在的精确不可变 tag vX.Y.Z 或 vX.Y.Z-rN(-rN = 同一
#     iteration 的发布重转标记,如 v1.6.3-r2;原 vX.Y.Z tag 不可变、绝不复用;
#     拒 latest/分支/SHA/其他变体);
#   - main HEAD 与发布身份无关:身份只来自 tag 的 git 解析。
#
# 失败语义(fail-closed,与硬化守卫一致):
#   - Guard 失败 → SSH 之前终止,无任何生产变更、无部署记录;
#   - 迁移失败(计划非法/镜像身份不符/迁移脚本非零退出)→ rollout 之前终止,
#     绝不更新 backend;记录收尾为 failure,绝无 success;
#   - 记录建立后的任何失败(SSH/锁/迁移/update.sh/身份不匹配/证据收尾)→
#     状态收尾为 failure,**绝不允许 success**;身份核验未通过前,
#     成功状态不存在任何代码路径;
#   - 生产可能已变更而证据收尾失败 → 打印 PRODUCTION STATE RECONCILIATION
#     REQUIRED,等待操作员对账,绝不伪造重试成功;
#   - 取消/传输不确定 = 状态非 success,production-closure 保持 fail-closed;
#     回滚 = 用上一个不可变 tag 重新 dispatch 本 workflow(无自动回滚)。
#
# break-glass 等价路径:手动 SSH + update.sh <tag> + 独立核验
# scripts/verify_runtime_identity.py → 同一 recorder(原子模式)→ 同一
# GitHub Deployment 证据模型(见 deploy/prod/update.sh 头部运行簿)。
#
# 操作员前置(仓库设置,非本仓提交数据):
#   - Environment `production`(建议 required reviewer 审批);
#   - Environment secret PROD_DEPLOY_SSH_KEY(专用部署私钥);
#   - Repository variables:PROD_SSH_HOST / PROD_SSH_USER /
#     PROD_SSH_KNOWN_HOSTS_B64(known_hosts 行的 base64,含主机公钥钉扎)/
#     可选 PROD_BACKEND_PORT(缺省 18000)。
#
# 2026-10-22 发布通道适配(A #138 正式授权;单一源码行为变更):
#   - 新增离线 RSA 签发与 4 项 PREFLIGHT_* Environment Secrets 退出发布依赖
#     (名称清单见 #138 授权原文)—— User 无私钥/新增秘密配置通道;整改实质
#     已由已验收的上传来源清零与 #187 恢复门禁落地;
#   - 部署前数据隔离 fail-closed 保留并加严:目标身份期望 = 随冻结镜像分发的
#     已审核事实(deploy/prod/production-identity.json;PG SID/Weaviate
#     CLUSTER_HOSTNAME/镜像 digest/卷名/uploads 挂载绑定),不再使用动态
#     逐文件卷清单哈希(活卷随活跃同步持续漂移,见 docs/release 漂移分析);
#     evaluator(容器内)核验注销来源全层残留全零、共享 *legacy* generation
#     存在、uploads 真实挂载目录与冻结 UNKNOWN 守卫逐文件哈希一致;
#   - 不安全旧版回滚保留强制:目标旧于已部署(已部署发布声明
#     previous_compatible=false)⇒ preflight(容器内 evaluator)与宿主
#     update.sh deployed-version 守卫([1.3/6])双道拒绝,均先于任何 mutation;
#   - 诚实边界:持有生产主机最高权限的手工 docker/脚本操作(含停止容器后
#     手工拉起旧镜像)不在脚本阻止范围;evaluator 随各自镜像冻结,经历史
#     ref dispatch 的旧 workflow 由宿主 update.sh 守卫拦截。

name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "不可变发布 tag(精确 vX.Y.Z;拒 latest/分支/SHA)"
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要全部 tag 才能 git 解析 tag→commit

      # ---- 1. 校验并冻结发布身份(唯一身份源 = tag 的 git 解析) ----
      - name: Resolve and freeze release identity
        id: identity
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          if [ "$TAG" = "latest" ] || [ "$TAG" = "main" ]; then
            echo "❌ 拒绝 '$TAG':只接受精确不可变 tag vX.Y.Z(latest/分支不是发布身份)" >&2
            exit 2
          fi
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-r(0|[1-9][0-9]*))?$ ]]; then
            echo "❌ 拒绝 '$TAG':tag 必须是 vX.Y.Z 或 vX.Y.Z-rN(重转后缀;拒 latest/分支/SHA/其他变体)" >&2
            exit 2
          fi
          SHA="$(git rev-parse --verify --quiet "${TAG}^{commit}" || true)"
          if [ -z "$SHA" ] || [ "${#SHA}" -ne 40 ]; then
            echo "❌ tag $TAG 无法解析为 40 位 commit(仓库中不存在或非法)" >&2
            exit 2
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"   >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "🔒 发布身份冻结: tag=$TAG version=$VERSION sha=$SHA(此后所有核验只对这一身份)"

      # ---- 2. Pre-mutation Guard:通过之前绝不触碰生产 ----
      - name: Release-publish guard (pre-mutation)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GUARD_TAG: ${{ steps.identity.outputs.tag }}
          GUARD_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/release_integrity_check.py \
            --mode release-publish --tag "$GUARD_TAG" --expected-sha "$GUARD_SHA"

      # ---- 3. 建立在途记录(in_progress;守卫侧 ≠ success) ----
      - name: Create in_progress deployment record
        id: record_create
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REC_TAG: ${{ steps.identity.outputs.tag }}
          REC_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          OUT="$(python3 scripts/record_production_deployment.py \
            --tag "$REC_TAG" --sha "$REC_SHA" --phase create 2>&1)"
          echo "$OUT"
          DEPLOYMENT_ID="$(printf '%s\n' "$OUT" | sed -n 's/.*deployment id=\([0-9][0-9]*\).*/\1/p')"
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "❌ 在途记录已建但未取得 deployment id" >&2
            exit 1
          fi
          echo "created=true"        >> "$GITHUB_OUTPUT"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      # ---- 3.5 生产兼容性 preflight(#46;fail-closed;先于任何生产 mutation) ----
      # evaluator/manifest/身份事实/上传守卫都从冻结镜像内提取(release-owned;
      # mutable main 无法重解释历史发布)。本步骤只调用、不裁决(update.sh 不变
      # policy engine);非零退出 ⇒ 在 DB migration(首个不可逆 mutation)之前
      # 中止,零生产变更。前契约镜像(镜像内无 evaluator)走有界兼容路径并显式
      # 留痕。
      #
      # 2026-10-22 发布通道适配(A #138 正式授权;详见文件头注):
      #   - 数据隔离断言强制启用(--verify-upload-isolation),身份期望 =
      #     镜像内已审核事实 deploy/prod/production-identity.json(PG SID/
      #     Weaviate CLUSTER_HOSTNAME/镜像 config digest/数据卷名/uploads 挂载
      #     绑定/UNKNOWN 守卫路径)——期望与被测目标分离(来自随发布冻结、
      #     经评审入库的事实文件,不自证;诚实边界:其独立性 = 仓库评审链,
      #     生产身份重建(如集群迁移)须先修订该文件并重审,否则预检 fail-closed);
      #   - 隔离断言核验(容器内 evaluator):PG 目标身份一致;注销来源
      #     knowledge-support-cases/knowledge-cb70f5ae 的 docs/versions/chunks/
      #     generations/外部引用/活动注册/未终态请求全零;Weaviate 实例身份
      #     匹配且 filesystem 检索残留 = 0;uploads 真实挂载目录与冻结 UNKNOWN
      #     守卫(路径+SHA256)集合相等;共享 *legacy* generation >= 1;
      #     只读探针失败/通道缺失 → FAIL/BLOCKED(fail-closed,不谎报 PASS);
      #   - 动态逐文件卷清单哈希退出强制锚(活卷随活跃同步持续漂移;扫描脚本
      #     scripts/weaviate_volume_manifest_scan.sh 保留为辅助审计工具);
      #   - 不安全旧版回滚强制:已部署版本事实(运行中 backend /app/RELEASE.json
      #     只读读取,缺失即 fail-closed)传入 evaluator,目标旧于已部署且已
      #     部署声明 previous_compatible=false ⇒ 拒绝;宿主 update.sh [1.3/6]
      #     守卫为第二道(覆盖历史 ref dispatch 的旧 workflow 路径);
      #   - 字符串 ACK 永不构成放行(evaluator 显式 FAIL;A #138 P3 原则保留);
      #   - 保留:production Environment、PROD_DEPLOY_SSH_KEY、PROD_SSH_* 三
      #     变量、known_hosts 严格校验、flock、冻结镜像 RELEASE.json 身份断言、
      #     迁移先于 rollout、/health version+git_sha 双断言、失败状态记录。
      - name: Production compatibility preflight (fail-closed; pre-mutation)
        id: preflight
        env:
          SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ vars.PROD_SSH_HOST }}
          SSH_USER: ${{ vars.PROD_SSH_USER }}
          SSH_KNOWN_HOSTS_B64: ${{ vars.PROD_SSH_KNOWN_HOSTS_B64 }}
          DEPLOY_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/prod_deploy_key"
          KH_FILE="$RUNNER_TEMP/prod_known_hosts"
          cleanup() { rm -f "$KEY_FILE" "$KH_FILE"; }
          trap cleanup EXIT INT TERM
          # 2026-10-22 通道适配:四个 PREFLIGHT_* 新 secret 退出必需清单;
          # 身份期望改由冻结镜像内已审核事实(deploy/prod/production-identity.json)
          # 提供,目标-期望分离保留(期望不来自被测目标自报)。
          for v in SSH_KEY SSH_HOST SSH_USER SSH_KNOWN_HOSTS_B64 DEPLOY_TAG; do
            if [ -z "${!v}" ]; then
              echo "❌ $v 未配置(production Environment secret / repository variables)" >&2
              echo "   → 隔离断言无法进行 → 部署中止" >&2
              exit 2
            fi
          done
          # DEPLOY_TAG 形状纵深复核(身份步已 ^vX.Y.Z(-rN)?$ 校验;远端 env
          # 前缀只接受已冻结 tag,绝不接受任意字符串)
          case "$DEPLOY_TAG" in
            v[0-9]*.[0-9]*.[0-9]*|v[0-9]*.[0-9]*.[0-9]*-r[0-9]*) ;;
            *) echo "❌ DEPLOY_TAG 形状非法(拒绝进入远端命令)" >&2; exit 2;;
          esac
          install -m 600 /dev/null "$KEY_FILE"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          printf '%s' "$SSH_KNOWN_HOSTS_B64" | base64 -d > "$KH_FILE"
          chmod 644 "$KH_FILE"
          if [ ! -s "$KH_FILE" ] || ! grep -q "$SSH_HOST" "$KH_FILE"; then
            echo "❌ known_hosts 钉扎缺失或与 PROD_SSH_HOST 不匹配(绝不关闭严格主机键校验)" >&2
            exit 2
          fi
          SSH_OPTS=(-i "$KEY_FILE"
              -o StrictHostKeyChecking=yes
              -o UserKnownHostsFile="$KH_FILE"
              -o BatchMode=yes
              -o ConnectTimeout=15
              -o ServerAliveInterval=30)
          # 单 SSH 会话执行远端 preflight(脚本本体经 stdin 原样传递;CI→SSH
          # 零凭据传输 —— DSN/Weaviate 目标由运行中 backend 容器自身 env 继承)
          remote_preflight() {
            ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" \
                "DEPLOY_TAG='$DEPLOY_TAG' RELEASE_SHA='${RELEASE_SHA:-}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/ask-ai
          exec 9>"${TMPDIR:-/tmp}/askai-deploy.lock"
          flock -w 0 9 || { echo "❌ 部署锁被占用(另一生产变更在执行)" >&2; exit 1; }
          export ASKAI_IMAGE_TAG="$DEPLOY_TAG"
          IMAGE="ghcr.io/harryhua-ai/ask-ai:$DEPLOY_TAG"
          COMPOSE="docker compose -f deploy/prod/docker-compose.yml"
          # 确定性清扫:上一轮可能残留的临时工件(均非秘密)—— 最小有效期
          rm -f "${TMPDIR:-/tmp}"/askai-preflight.* "${TMPDIR:-/tmp}"/askai-compat.* \
                "${TMPDIR:-/tmp}"/askai-release.* "${TMPDIR:-/tmp}"/askai-identity.* \
                "${TMPDIR:-/tmp}"/askai-uploads-guard.* 2>/dev/null || true
          REL_TMP="$(mktemp "${TMPDIR:-/tmp}/askai-release.XXXXXXXX")"
          MAN_TMP="$(mktemp "${TMPDIR:-/tmp}/askai-compat.XXXXXXXX")"
          EVAL_TMP="$(mktemp "${TMPDIR:-/tmp}/askai-preflight.XXXXXXXX")"
          ID_TMP="$(mktemp "${TMPDIR:-/tmp}/askai-identity.XXXXXXXX")"
          GUARD_TMP="$(mktemp "${TMPDIR:-/tmp}/askai-uploads-guard.XXXXXXXX")"
          # D2(A 评审 2026-10-23):精确所有权清理 —— 删除仅当对象清理时仍指向
          # 本次发布记录的 inode(创建时捕获 dev:ino;清理经 fd 链式定位 +
          # O_NOFOLLOW 打开 + 身份匹配)。同内容不同 inode/路径状态不可信 ⇒
          # 拒删;可验证清理失败 ⇒ 无 PREFLIGHT PASS(绝不 || true 吞掉);
          # 绝不按名称模式清理来源不明的陈旧文件(GUARD_IDENT 为空 = 本轮
          # 未送达 ⇒ 对容器零删除操作)。
          guard_release() {
            [ -n "${GUARD_IDENT:-}" ] || return 0
            $COMPOSE exec -T backend python3 -c 'exec(__import__("textwrap").dedent("""
              # askai-guard-release-v2
              import os, sys, stat
              T = sys.argv[1]; IDENT = sys.argv[2]
              D = os.path.dirname(T); NAME = os.path.basename(T)
              want_dev, want_ino = map(int, IDENT.split(":"))
              def xclose(fd):
                  try: os.close(fd)
                  except OSError: pass
              def walk_to_parent():
                  fd = os.open("/", os.O_RDONLY | os.O_DIRECTORY)
                  try:
                      for comp in [c for c in D.split("/") if c]:
                          nfd = os.open(comp, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
                          xclose(fd); fd = nfd
                      return fd
                  except OSError:
                      xclose(fd); return None
              fd = walk_to_parent()
              if fd is None:
                  print("__G3_REL_DIR_UNSTABLE__"); sys.exit(1)
              try:
                  f = os.open(NAME, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=fd)
              except FileNotFoundError:
                  xclose(fd); print("__G3_REL_ABSENT__"); sys.exit(0)
              except OSError:
                  xclose(fd); print("__G3_REL_REFUSED__"); sys.exit(1)
              try:
                  s = os.fstat(f)
              finally:
                  xclose(f)
              if not stat.S_ISREG(s.st_mode) or s.st_dev != want_dev or s.st_ino != want_ino:
                  xclose(fd); print("__G3_REL_IDENTITY_MISMATCH__"); sys.exit(1)
              try:
                  os.unlink(NAME, dir_fd=fd)
              except OSError:
                  xclose(fd); print("__G3_REL_UNLINK_FAILED__"); sys.exit(1)
              xclose(fd); print("__G3_REL_OK__"); sys.exit(0)
              """))' "$GUARD_TARGET" "$GUARD_IDENT" 2>/dev/null
          }
          cleanup() {
            rm -f "$REL_TMP" "$MAN_TMP" "$EVAL_TMP" "$ID_TMP" "$GUARD_TMP"
            if [ -n "${GUARD_IDENT:-}" ]; then
              # 失败/中断路径的尽力回收(身份核对在容器内执行);失败如实告警,
              # 不掩盖原退出状态,也绝不盲删
              guard_release >/dev/null 2>&1 \
                || echo "⚠ 本次守卫工件未能按身份回收($GUARD_TARGET)—— 留存待人工核验,绝不盲删" >&2
              GUARD_IDENT=""
            fi
          }
          trap cleanup EXIT
          # 1) 拉取冻结镜像;时代判定源 = 镜像内 RELEASE.json 旗标(blocker 3)
          docker pull "$IMAGE" >/dev/null
          CID=$(docker create "$IMAGE")
          docker cp "$CID:/app/RELEASE.json" "$REL_TMP" >/dev/null 2>&1 || {
              docker rm "$CID" >/dev/null 2>&1 || true
              echo "❌ 镜像内无 RELEASE.json:非版本化镜像,拒绝部署" >&2
              exit 1
          }
          ERA="$(python3 -c "import json,sys;print('contract' if json.load(open(sys.argv[1])).get('compatibility_contract') else 'pre_contract')" "$REL_TMP")"
          rm -f "$REL_TMP"
          EVAL_OK=1
          docker cp "$CID:/app/scripts/release_preflight.py" "$EVAL_TMP" >/dev/null 2>&1 || EVAL_OK=0
          if [ "$ERA" = "contract" ]; then
            # 契约期:evaluator/manifest/身份事实/上传守卫必须真实打包(REVIEW_1 blocker 1/3)
            if [ "$EVAL_OK" != 1 ]; then
                docker rm "$CID" >/dev/null 2>&1 || true
                echo "❌ 契约期镜像缺失 scripts/release_preflight.py(打包违约)—— fail-closed" >&2
                exit 1
            fi
            docker cp "$CID:/app/deploy/prod/compatibility.json" "$MAN_TMP" >/dev/null 2>&1 || {
                docker rm "$CID" >/dev/null 2>&1 || true
                echo "❌ 契约期镜像缺失 deploy/prod/compatibility.json(打包违约)—— fail-closed" >&2
                exit 1
            }
            docker cp "$CID:/app/deploy/prod/production-identity.json" "$ID_TMP" >/dev/null 2>&1 || {
                docker rm "$CID" >/dev/null 2>&1 || true
                echo "❌ 契约期镜像缺失 deploy/prod/production-identity.json(已审核目标身份事实;打包违约)—— fail-closed" >&2
                exit 1
            }
            docker cp "$CID:/app/deploy/prod/uploads-unknown-guard.tsv" "$GUARD_TMP" >/dev/null 2>&1 || {
                docker rm "$CID" >/dev/null 2>&1 || true
                echo "❌ 契约期镜像缺失 deploy/prod/uploads-unknown-guard.tsv(冻结 UNKNOWN 守卫;打包违约)—— fail-closed" >&2
