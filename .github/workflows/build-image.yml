# ask-ai CI/CD:构建 GPU Docker 镜像,push GHCR
#
# 触发:
#   - push to main(代码合并)→ 构建 + tag latest + sha
#   - tag v*.*.*(发版)→ 构建 + tag semver
#   - manual(workflow_dispatch)→ 按需构建
#
# tesla-t4 更新:`docker compose pull && docker compose up -d`(见 deploy/tesla-t4/update.sh)
#
# 镜像:ghcr.io/harryhua-ai/ask-ai:<tag>
#   - 同一镜像服务 backend(uvicorn)+ sync worker(python scripts/sync.py),compose 用 command 覆盖

name: Build & Push GPU Image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  test:
    # 先跑测试,test fail 不出镜像
    runs-on: ubuntu-latest
    env:
      # 对齐 settings 默认(test_sync_db 用 settings.postgres_dsn=ask_ai:changeme)
      # admin conftest 也读 TEST_DATABASE_URL → 统一 ask_ai:changeme + ask_ai_test
      TEST_DATABASE_URL: postgresql+asyncpg://ask_ai:changeme@localhost:5432/ask_ai_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # 对齐 settings 默认(test_sync_db 用 ask_ai:changeme + POSTGRES_DB=ask_ai_test)
          POSTGRES_DB: ask_ai_test
          POSTGRES_USER: ask_ai
          POSTGRES_PASSWORD: changeme
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev  # 装 dev 依赖(pytest 等)跑测试
      # CI 跑单元测试 + 关键集成(pipeline/retrieval/connectors/db 基础)
      # 跳过依赖运行时 seed 数据的 admin 集成测试(需 DB 已 seed,CI 空 DB 没有)
      # 以及需 ENCRYPTION_KEY 的 llm_providers
      - run: uv run pytest tests/ -q --ignore=tests/api/admin --ignore=tests/scripts/test_sync_db.py

  build-and-push:
    # 构建 GPU 镜像,push GHCR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build admin SPA
        run: |
          cd widget && npm ci && cd ../admin && npm ci && npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # GPU 镜像大(~3-4GB),buildx 缓存加速后续构建
