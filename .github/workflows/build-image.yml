# ask-ai CI/CD:构建 GPU Docker 镜像,push GHCR
#
# 触发:
#   - push to main(代码合并)→ 构建 + tag latest + sha
#   - tag v*.*.*(发版)→ 构建 + tag semver
#   - manual(workflow_dispatch)→ 按需构建
#
# tesla-t4 更新:`docker compose pull && docker compose up -d`(见 deploy/tesla-t4/update.sh)
#
# 镜像:ghcr.io/harryhua-ai/ask-ai:<tag>
#   - 同一镜像服务 backend(uvicorn)+ sync worker(python scripts/sync.py),compose 用 command 覆盖

name: Build & Push GPU Image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  test:
    # 先跑测试,test fail 不出镜像
    runs-on: ubuntu-latest
    env:
      # 对齐 settings 默认(test_sync_db 用 settings.postgres_dsn=ask_ai:changeme)
      # admin conftest 也读 TEST_DATABASE_URL → 统一 ask_ai:changeme + ask_ai_test
      TEST_DATABASE_URL: postgresql+asyncpg://ask_ai:changeme@localhost:5432/ask_ai_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # 对齐 settings 默认(test_sync_db 用 ask_ai:changeme + POSTGRES_DB=ask_ai_test)
          POSTGRES_DB: ask_ai_test
          POSTGRES_USER: ask_ai
          POSTGRES_PASSWORD: changeme
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev  # 装 dev 依赖(pytest 等)跑测试
      # CI 跑单元测试 + 关键集成(pipeline/retrieval/connectors/db 基础)
      # 跳过依赖运行时 seed 数据的 admin 集成测试(需 DB 已 seed,CI 空 DB 没有)
      # 以及需 ENCRYPTION_KEY 的 llm_providers、需 HF 模型缓存的 embedder(CI 无 HF 访问)
      # 以及需运行服务的 e2e(打 /api/ask)
      - run: uv run pytest tests/ -q --ignore=tests/api/admin --ignore=tests/scripts/test_sync_db.py --ignore=tests/embedder --ignore=tests/e2e

  build-and-push:
    # 构建 GPU 镜像,push GHCR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build admin & widget SPA
        run: |
          cd widget && npm ci && npm run build && cd ../admin && npm ci && npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # #10 版本与发布治理:构建期生成不可变 RELEASE.json(权威链第一步)。
      # tag 构建:version = tag(去 v 前缀的 SemVer);main/manual:0.0.0+main.<sha8>
      # (合法 SemVer build metadata,非正式版本,不会假冒发布)。
      - name: Generate RELEASE.json
        id: release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$GITHUB_REF_NAME"
            IMAGE_TAG="$GITHUB_REF_NAME"
          else
            VERSION="0.0.0+main.$(echo "$GITHUB_SHA" | cut -c1-8)"
            IMAGE_TAG="sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          bash scripts/generate_release_manifest.sh \
            "$VERSION" "$GITHUB_SHA" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG" \
            "${{ github.run_id }}" RELEASE.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          # mode=min:只缓存最终镜像层,不回写 builder 中间层(.venv 9.4GB + torch 2.7GB)。
          # 实测 mode=max 回写 GHA cache 耗 36min(占总 build 45min 的 80%)。
          # 改 min 后:pyproject/uv.lock 不变时 uv sync+torch 层靠 cache-from 照样命中(极少改),
          # 回写量从 ~14GB → ~5GB,build 预计 45min → ~15min。
          # GIT_SHA build-arg: bust COPY backend/ 层的 stale cache,确保代码层随 commit 重建

      - name: Assert in-image RELEASE.json matches this build
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_SHA: ${{ github.sha }}
          PRIMARY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.image_tag }}
        run: |
          CID=$(docker create "$PRIMARY_IMAGE")
          docker cp "$CID:/app/RELEASE.json" ./RELEASE.image.json
          docker rm "$CID" > /dev/null
          ACTUAL_VERSION=$(jq -r .version ./RELEASE.image.json)
          ACTUAL_SHA=$(jq -r .git_sha ./RELEASE.image.json)
          echo "in-image RELEASE.json: version=$ACTUAL_VERSION git_sha=$ACTUAL_SHA"
          if [ "$ACTUAL_VERSION" != "${EXPECTED_VERSION#v}" ]; then
            echo "❌ 镜像内 version=$ACTUAL_VERSION ≠ 构建 $EXPECTED_VERSION"; exit 1
          fi
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "❌ 镜像内 git_sha=$ACTUAL_SHA ≠ 构建 $EXPECTED_SHA"; exit 1
          fi
