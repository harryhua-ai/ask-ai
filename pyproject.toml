[project]
name = "ask-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "weaviate-client>=4.10",
    "FlagEmbedding>=1.3",
    "transformers>=4.41,<5.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.1",
    "langdetect>=1.0.9",
    "tiktoken>=0.9",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=1.13",  # 代码 AST 分块(chunk_code)
    "slowapi>=0.1.9",
    "PyJWT>=2.8",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<4.1",  # passlib 1.7 依赖 bcrypt.__about__(4.1+ 已移除)
    "cryptography>=43.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.9",
    "black>=25.0",
    "isort>=5.13",
]

[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "unit: 单元测试",
    "integration: 集成测试(需要外部服务)",
    "slow: 慢速测试",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"
